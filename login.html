<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: #1f4e78;
            color: white;
            border-radius: 50%;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #1f4e78;
            font-size: 24px;
            margin-top: 15px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e78;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #1f4e78;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #163a5c;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }

        .error {
            display: none;
            background: #f8d7da;
            color: #842029;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <div class="logo-icon">?</div>

                <h1>Preguntas y Respuestas</h1>

                <p class="subtitle">
                    Inicie sesión para continuar
                </p>
            </div>

            <div id="error" class="error">
                Debe ingresar su correo y contraseña.
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Ingrese su correo"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button">
                    INGRESAR
                </button>

            </form>

            <div class="footer">
                Sistema de Preguntas y Respuestas
            </div>

        </div>

    </div>
    
<script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",
        authDomain: "sistema-preguntas-respuestas.firebaseapp.com",
        projectId: "sistema-preguntas-respuestas",
        storageBucket: "sistema-preguntas-respuestas.firebasestorage.app",
        messagingSenderId: "606737336904",
        appId: "1:606737336904:web:44fb42be60fbdaaf08667d"
    };


    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);

    // Inicializar Authentication
    const auth = getAuth(app);


    // Formulario de Login
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const error = document.getElementById("error");

        error.style.display = "none";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            // Login correcto
            window.location.href = "dashboard.html";

        } catch (e) {

            console.error(e);

            error.textContent =
                "Correo o contraseña incorrectos.";

            error.style.display = "block";

        }

    });

</script>
</body>
</html>
