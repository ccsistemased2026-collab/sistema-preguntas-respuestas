<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nueva pregunta</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #1f4e78;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<header>

    <h2>
        Nueva pregunta
    </h2>

</header>


<main class="container">

    <div class="card">

        <form id="preguntaForm">

            <div class="form-group">

                <label for="categoria">
                    Categoría
                </label>

                <select id="categoria" required>

                    <option value="">
                        Seleccione una categoría
                    </option>

                    <option value="OPERATIVO">
                        Operativo
                    </option>

                    <option value="SISTEMA">
                        Sistema
                    </option>

                    <option value="PROCEDIMIENTO">
                        Procedimiento
                    </option>

                    <option value="OTROS">
                        Otros
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="pregunta">
                    Pregunta
                </label>

                <textarea
                    id="pregunta"
                    placeholder="Escriba su pregunta..."
                    required></textarea>

            </div>


            <button type="submit">

                REGISTRAR PREGUNTA

            </button>

        </form>

    </div>

</main>
<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // CONFIGURACIÓN FIREBASE

    const firebaseConfig = {

        apiKey: "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",
        authDomain: "sistema-preguntas-respuestas.firebaseapp.com",
        projectId: "sistema-preguntas-respuestas",
        storageBucket: "sistema-preguntas-respuestas.firebasestorage.app",
        messagingSenderId: "606737336904",
        appId: "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    // Inicializar Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // Verificar usuario

    let usuarioActual = null;


    onAuthStateChanged(auth, (user) => {

        if (!user) {

            window.location.href = "login.html";

            return;
        }

        usuarioActual = user;

    });


    // Registrar pregunta

    const formulario =
        document.getElementById("preguntaForm");


    formulario.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const categoria =
                document.getElementById("categoria").value;

            const pregunta =
                document.getElementById("pregunta").value.trim();


            if (!usuarioActual) {

                alert(
                    "La sesión no está disponible."
                );

                return;
            }


            try {

                await addDoc(
                    collection(db, "preguntas"),
                    {

                        usuarioId:
                            usuarioActual.uid,

                        usuarioCorreo:
                            usuarioActual.email,

                        categoria:
                            categoria,

                        pregunta:
                            pregunta,

                        fecha:
                            serverTimestamp(),

                        estado:
                            "PENDIENTE"

                    }
                );


                alert(
                    "Pregunta registrada correctamente."
                );


                window.location.href =
                    "preguntas.html";


            } catch (error) {

                console.error(error);

                alert(
                    "No se pudo registrar la pregunta."
                );

            }

        }
    );

</script>
</body>

</html>
