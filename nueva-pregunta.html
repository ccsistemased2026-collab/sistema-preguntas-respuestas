<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nueva pregunta</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

        }


        header {

            background: #1f4e78;

            color: white;

            padding: 18px 30px;

        }


        .container {

            width: 90%;

            max-width: 800px;

            margin: 40px auto;

        }


        .card {

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.08);

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        select,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        select {

            background: white;

        }


        textarea {

            min-height: 160px;

            resize: vertical;

        }


        .botones {

            display: flex;

            gap: 12px;

            margin-top: 20px;

        }


        .btn-registrar {

            flex: 1;

            padding: 14px;

            border: none;

            background: #1f4e78;

            color: white;

            font-size: 16px;

            border-radius: 6px;

            cursor: pointer;

        }


        .btn-registrar:hover {

            background: #163a5c;

        }


        .btn-cancelar {

            flex: 1;

            padding: 14px;

            background: #6c757d;

            color: white;

            font-size: 16px;

            border-radius: 6px;

            text-align: center;

            text-decoration: none;

        }


        .btn-cancelar:hover {

            background: #5a6268;

        }


        .mensaje {

            margin-top: 15px;

            text-align: center;

            font-size: 14px;

            color: #555;

        }


    </style>

</head>


<body>


<header>

    <h2>
        Nueva pregunta
    </h2>

</header>


<main class="container">


    <div class="card">


        <form id="preguntaForm">


            <!-- =========================================
                 ÁREA
            ========================================== -->

            <div class="form-group">


                <label for="area">

                    Área

                </label>


                <select
                    id="area"
                    required>


                    <option value="">

                        Seleccione un área

                    </option>


                    <option value="METODOLOGÍA">

                        METODOLOGÍA

                    </option>


                    <option value="CAPACITACIÓN">

                        CAPACITACIÓN

                    </option>


                    <option value="ADMIN Y RRHH">

                        ADMIN Y RRHH

                    </option>


                    <option value="SISTEMAS">

                        SISTEMAS

                    </option>


                </select>


            </div>


            <!-- =========================================
                 PREGUNTA
            ========================================== -->

            <div class="form-group">


                <label for="pregunta">

                    Pregunta

                </label>


                <textarea
                    id="pregunta"
                    placeholder="Escriba su pregunta..."
                    required></textarea>


            </div>

            <div class="form-group">

                <label for="archivo">
                    Archivo adjunto (opcional)
                </label>
            
                <input
                    type="file"
                    id="archivo"
                    accept=".jpg,.jpeg,.pdf">
            
                <small>
                    Formatos permitidos: JPG, JPEG y PDF.
                    Tamaño máximo: 5 MB.
                </small>
            
            </div>
            <!-- =========================================
                 BOTONES
            ========================================== -->

            <div class="botones">


                <button
                    type="submit"
                    class="btn-registrar"
                    id="btnRegistrar">

                    REGISTRAR PREGUNTA

                </button>


                <a
                    href="preguntas.html"
                    class="btn-cancelar">

                    CANCELAR

                </a>


            </div>


            <div
                id="mensaje"
                class="mensaje">
            </div>


        </form>


    </div>


</main>


<script type="module">


    // =====================================================
    // IMPORTACIONES FIREBASE
    // =====================================================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // CONFIGURACIÓN FIREBASE
    // =====================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",

        authDomain:
            "sistema-preguntas-respuestas.firebaseapp.com",

        projectId:
            "sistema-preguntas-respuestas",

        storageBucket:
            "sistema-preguntas-respuestas.firebasestorage.app",

        messagingSenderId:
            "606737336904",

        appId:
            "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    // =====================================================
    // INICIALIZAR FIREBASE
    // =====================================================

    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    // =====================================================
    // VARIABLES
    // =====================================================

    let usuarioActual = null;


    // =====================================================
    // VERIFICAR USUARIO
    // =====================================================

    onAuthStateChanged(

        auth,

        (user) => {


            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            usuarioActual =
                user;


        }

    );


    // =====================================================
    // FORMULARIO
    // =====================================================

    const formulario =
        document.getElementById(
            "preguntaForm"
        );


    formulario.addEventListener(

        "submit",

        async function(event) {


            event.preventDefault();


            // =============================================
            // OBTENER DATOS
            // =============================================

        const area =
            document.getElementById("area").value;
        
        const pregunta =
            document.getElementById("pregunta").value.trim();
        
        const archivoInput =
            document.getElementById("archivo");
        
        const archivo =
            archivoInput.files[0];


            // =============================================
            // VALIDAR SESIÓN
            // =============================================

            if (!usuarioActual) {

                alert(
                    "La sesión no está disponible."
                );

                return;

            }


            // =============================================
            // VALIDAR ÁREA
            // =============================================

            if (!area) {

                alert(
                    "Debe seleccionar un área."
                );

                return;

            }


            // =============================================
            // VALIDAR PREGUNTA
            // =============================================

            if (!pregunta) {

                alert(
                    "Debe escribir la pregunta."
                );

                return;

            }


            try {


                // =========================================
                // DESHABILITAR BOTÓN
                // =========================================

                boton.disabled =
                    true;


                boton.textContent =
                    "REGISTRANDO...";


                mensaje.textContent =
                    "Guardando pregunta...";


                // =========================================
                // GUARDAR EN FIRESTORE
                // =========================================
                let archivoUrl = "";
                let archivoNombre = "";
                let archivoTipo = "";
                 await addDoc(
                    collection(db, "preguntas"),
                    {
                
                        usuarioId:
                            usuarioActual.uid,
                
                        usuarioCorreo:
                            usuarioActual.email,
                
                        area:
                            area,
                
                        pregunta:
                            pregunta,
                
                        archivoUrl:
                            archivoUrl,
                
                        archivoNombre:
                            archivoNombre,
                
                        archivoTipo:
                            archivoTipo,
                
                        fecha:
                            serverTimestamp(),
                
                        estado:
                            "PENDIENTE"
                
                    }
                );


                // =========================================
                // ÉXITO
                // =========================================

                alert(
                    "Pregunta registrada correctamente."
                );


                window.location.href =
                    "preguntas.html";


            } catch (error) {


                console.error(
                    "Error registrando pregunta:",
                    error
                );


                alert(
                    "No se pudo registrar la pregunta."
                );


                boton.disabled =
                    false;


                boton.textContent =
                    "REGISTRAR PREGUNTA";


                mensaje.textContent =
                    "";

            }

        }

    );
if (archivo) {

    const extensionesPermitidas = [
        ".jpg",
        ".jpeg",
        ".pdf"
    ];

    const nombreArchivo =
        archivo.name.toLowerCase();

    const extensionValida =
        extensionesPermitidas.some(
            extension =>
                nombreArchivo.endsWith(extension)
        );

    if (!extensionValida) {

        alert(
            "Solo se permiten archivos JPG, JPEG o PDF."
        );

        return;
    }


    const maximo =
        10 * 1024 * 1024;


    if (archivo.size > maximo) {

        alert(
            "El archivo no puede superar los 10 MB."
        );

        return;
    }


    const formData =
        new FormData();


    formData.append(
        "file",
        archivo
    );


    formData.append(
        "upload_preset",
        "preguntas_adjuntos"
    );


    const url =
        "https://api.cloudinary.com/v1_1/aiq51pxu/auto/upload";


    try {

        const respuesta =
            await fetch(
                url,
                {
                    method: "POST",
                    body: formData
                }
            );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            console.error(datos);

            throw new Error(
                datos.error?.message ||
                "No se pudo subir el archivo."
            );

        }


        archivoUrl =
            datos.secure_url;

        archivoNombre =
            archivo.name;

        archivoTipo =
            datos.resource_type;


    } catch (error) {

        console.error(error);

        alert(
            "No se pudo cargar el archivo adjunto."
        );

        return;

    }

}

</script>


</body>

</html>
