    <!-- =====================================================

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f9;

            color: #333;

        }

        .contenedor {

            max-width: 1200px;

            margin: 0 auto;

        }

        .encabezado {

            display: flex;

        .btn-dashboard {

            margin-bottom: 20px;

        }

        .btn-dashboard:hover {

            background: #5a6268;

        }

        .btn-nueva {

            background: #198754;

        }

        .btn-nueva:hover {

            background: #157347;

        }

        .btn-excel {

        }

        .btn-excel:hover {

        }

        }

        table {

        }

        td {

            padding: 13px;

            border-bottom: 1px solid #dee2e6;

        }

        tr:hover td {

            background: #f8f9fa;

        }

        .estado {

            display: inline-block;

            border-radius: 15px;

        .estado-pendiente {

        .estado-respondida {

        .mensaje {

        .error {

            color: #dc3545;

        @media (max-width: 700px) {

            .encabezado {

                align-items: flex-start;

            }

            .encabezado h1 {

            }

            .acciones {

                width: 100%;

            }

            .acciones button,
            .acciones a {

                width: 100%;

                text-align: center;

            }

        }

    </style>

</head>

<body>

<div class="contenedor">

    <!-- =====================================================
         ENCABEZADO

    <div class="encabezado">

        <h1>
            PREGUNTAS

        <div class="acciones">

    <!-- =====================================================

    <!-- =====================================================

    <div

        class="notificacion"

        🔔 Preguntas pendientes:

        <span id="contadorPendientes">

    <!-- =====================================================

    <div class="filtros">

        <input
            type="text"
            id="buscador"

            placeholder="🔎 Buscar pregunta, usuario, cargo o sede...">

        <select id="filtroArea">

            <option value="TODOS">

            </option>

            <option value="METODOLOGÍA">

            </option>

            <option value="CAPACITACIÓN">
                CAPACITACIÓN
            </option>

            <option value="ADMIN Y RRHH">
                ADMIN Y RRHH
            </option>

            <option value="SISTEMAS">
                SISTEMAS
            </option>

        </select>

        <select id="filtroSede">

            <option value="TODOS">
                Todas las sedes
            </option>

        </select>

        <select id="filtroEstado">

            <option value="TODOS">
                Todos los estados
            </option>

            <option value="PENDIENTE">
                Pendiente
            </option>

            <option value="RESPONDIDA">

            </option>

    </div>

    <!-- =====================================================
         TABLA
    ====================================================== -->

    <div class="tabla-contenedor">

        <table>

            <thead>

                <tr>

                    <th>N°</th>

                    <th>PREGUNTA</th>

                    <th>ÁREA</th>

                    <th>USUARIO</th>

                    <th>CARGO</th>

                    <th>SEDE OPERATIVA</th>

                    <th>FECHA</th>

                    <th>ESTADO</th>

                    <th>ACCIONES</th>

            </thead>

            <tbody id="tablaPreguntas">

                <tr>

                    <td
                        colspan="10"
                        class="mensaje cargando">

                        Cargando información...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script type="module">

    // =====================================================
    // FIREBASE
    // =====================================================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy,
        deleteDoc,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    // =====================================================
    // CONFIGURACIÓN FIREBASE
    // =====================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",

        authDomain:
            "sistema-preguntas-respuestas.firebaseapp.com",

        projectId:
            "sistema-preguntas-respuestas",

        storageBucket:
            "sistema-preguntas-respuestas.firebasestorage.app",

        messagingSenderId:
            "606737336904",

        appId:
            "1:606737336904:web:44fb42be60fbdaaf08667d"

    };

    // =====================================================
    // INICIALIZAR
    // =====================================================

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);

    // =====================================================
    // VARIABLES
    // =====================================================

    let todasLasPreguntas = [];

    let usuarios = {};

    let usuarioActualRol = "";

    // =====================================================
    // SEDES OPERATIVAS
    // =====================================================

    const sedesOperativas = [

        "AMAZONAS-BAGUA GRANDE",
        "AMAZONAS-CHACHAPOYAS",

        "ÁNCASH-CHIMBOTE",
        "ÁNCASH-HUARAZ",
        "ÁNCASH-POMABAMBA",

        "APURÍMAC-ABANCAY",
        "APURÍMAC-ANDAHUAYLAS",

        "AREQUIPA-AREQUIPA",
        "AREQUIPA-CAMANÁ",

        "AYACUCHO-HUAMANGA",
        "AYACUCHO-PUQUIO",

        "CAJAMARCA-CAJAMARCA",
        "CAJAMARCA-CHOTA",
        "CAJAMARCA-JAÉN",

        "CALLAO",

        "CUSCO-SICUANI",
        "CUSCO-CUSCO",
        "CUSCO-LA CONVENCIÓN",

        "HUANCAVELICA-HUANCAVELICA",
        "HUANCAVELICA-PAMPAS",

        "HUÁNUCO-HUÁNUCO",
        "HUÁNUCO-TINGO MARÍA",

        "ICA-CHINCHA",
        "ICA-ICA",

        "JUNÍN-HUANCAYO",
        "JUNÍN-TARMA",

        "LA LIBERTAD-HUAMACHUCO",
        "LA LIBERTAD-TRUJILLO",

        "LAMBAYEQUE-CHICLAYO",

        "LIMA METROPOLITANA-CENTRO",
        "LIMA METROPOLITANA-NORTE",
        "LIMA METROPOLITANA-SUR",
        "LIMA METROPOLITANA-ESTE",

        "LIMA PROVINCIAS-CAÑETE",
        "LIMA PROVINCIAS-HUACHO",

        "LORETO-IQUITOS",
        "LORETO-YURIMAGUAS",

        "MADRE DE DIOS",

        "MOQUEGUA",

        "PASCO",

        "PIURA-PIURA",
        "PIURA-SULLANA",

        "PUNO-AZÁNGARO",
        "PUNO-JULIACA",
        "PUNO-PUNO",

        "SAN MARTÍN-MOYOBAMBA",
        "SAN MARTÍN-TARAPOTO",

        "TACNA",

        "TUMBES",

        "UCAYALI-PUCALLPA"

    ];

    // =====================================================
    // CARGAR SEDES
    // =====================================================

    function cargarSedesFiltro() {

        const filtroSede =
            document.getElementById(
                "filtroSede"
            );

        sedesOperativas.forEach(
            (sede) => {

                const opcion =
                    document.createElement(
                        "option"
                    );

                opcion.value =
                    sede;

                opcion.textContent =
                    sede;

                filtroSede.appendChild(
                    opcion
                );

            }
        );

    }

    // =====================================================
    // OBTENER ROL
    // =====================================================

    async function obtenerRolUsuario(user) {

        const usuarioRef =
            doc(
                db,
                "usuarios",
                user.uid
            );

        const usuarioSnapshot =
            await getDoc(
                usuarioRef
            );

        if (
            !usuarioSnapshot.exists()
        ) {

            return "";

        }

        const datosUsuario =
            usuarioSnapshot.data();

        return (
            datosUsuario.rol || ""
        );

    }

    // =====================================================
    // OBTENER ÁREA
    // =====================================================

    function obtenerArea(datos) {

        return (

            datos.area

            ||

            datos.categoria

            ||

            ""

        );

    }

    // =====================================================
    // CARGAR USUARIOS
    // =====================================================

    async function cargarUsuarios() {

        try {

            const resultado =
                await getDocs(
                    collection(
                        db,
                        "usuarios"
                    )
                );

            usuarios = {};

            resultado.forEach(
                (documento) => {

                    const datos =
                        documento.data();

                    usuarios[
                        documento.id
                    ] = {

                        nombre:
                            datos.nombre || "",

                        correo:
                            datos.correo
                            ||
                            datos.email
                            ||
                            "",

                        cargo:
                            datos.cargo || "",

                        sedeOperativa:
                            datos.sedeOperativa
                            ||
                            ""

                    };

                }
            );

        } catch (error) {

            console.warn(
                "No se pudo cargar el listado completo de usuarios:",
                error
            );

            usuarios = {};

        }

    }

    // =====================================================
    // CARGAR PREGUNTAS
    // =====================================================

    async function cargarPreguntas() {

        const tabla =
            document.getElementById(
                "tablaPreguntas"
            );

        tabla.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="mensaje cargando">

                    Cargando información...

                </td>

            </tr>

        `;

        try {

            const consulta =
                query(

                    collection(
                        db,
                        "preguntas"
                    ),

                    orderBy(
                        "fecha",
                        "desc"
                    )

                );

            const resultado =
                await getDocs(
                    consulta
                );

            todasLasPreguntas = [];

            resultado.forEach(
                (documento) => {

                    const datos =
                        documento.data();

                    const usuario =
                        usuarios[
                            datos.usuarioId
                        ]
                        ||
                        {};

                    todasLasPreguntas.push({

                        id:
                            documento.id,

                        pregunta:
                            datos.pregunta
                            ||
                            "",

                        area:
                            obtenerArea(
                                datos
                            ),

                        usuarioCorreo:
                            datos.usuarioCorreo
                            ||
                            usuario.correo
                            ||
                            "",

                        usuarioId:
                            datos.usuarioId
                            ||
                            "",

                        usuarioNombre:
                            datos.nombreConsultador
                            ||
                            datos.usuarioNombre
                            ||
                            usuario.nombre
                            ||
                            "",

                        cargo:
                            datos.cargo
                            ||
                            usuario.cargo
                            ||
                            "No registrado",

                        sedeOperativa:
                            datos.sedeOperativa
                            ||
                            usuario.sedeOperativa
                            ||
                            "No registrada",

                        estado:
                            datos.estado
                            ||
                            "PENDIENTE",

                        fecha:
                            datos.fecha
                            ||
                            null,

                        archivoUrl:
                            datos.archivoUrl
                            ||
                            "",

                        archivoNombre:
                            datos.archivoNombre
                            ||
                            "",

                        archivoTipo:
                            datos.archivoTipo
                            ||
                            ""

                    });

                }
            );

            mostrarPreguntas(
                todasLasPreguntas
            );

            actualizarContadorPendientes();

        } catch (error) {

            console.error(
                "Error cargando preguntas:",
                error
            );

            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="mensaje error">

                        <strong>
                            No se pudo cargar la información.
                        </strong>

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;

        }

    }

    // =====================================================
    // MOSTRAR PREGUNTAS
    // =====================================================

    function mostrarPreguntas(
        preguntas
    ) {

        const tabla =
            document.getElementById(
                "tablaPreguntas"
            );

        if (
            preguntas.length === 0
        ) {

            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="mensaje">

                        No existen preguntas.

                    </td>

                </tr>

            `;

            return;

        }

        tabla.innerHTML = "";

        preguntas.forEach(
            (pregunta, indice) => {

                let fecha = "";

                if (

                    pregunta.fecha

                    &&

                    typeof pregunta.fecha.toDate ===
                    "function"

                ) {

                    fecha =
                        pregunta.fecha
                            .toDate()
                            .toLocaleString(
                                "es-PE"
                            );

                }

                let claseEstado =
                    "estado-pendiente";

                if (
                    pregunta.estado ===
                    "RESPONDIDA"
                ) {

                    claseEstado =
                        "estado-respondida";

                }

                // =================================================
                // ELIMINAR
                // =================================================

                let botonEliminar = "";

                if (
                    usuarioActualRol ===
                    "ADMINISTRADOR"
                ) {

                    botonEliminar = `

                        <button
                            type="button"
                            class="btn-eliminar"
                            data-id="${escapeHTML(
                                pregunta.id
                            )}">

                            🗑️ Eliminar

                        </button>

                    `;

                }

                // =================================================
                // ARCHIVO
                // =================================================

                let botonArchivo = "—";

                if (
                    pregunta.archivoUrl
                ) {

                    botonArchivo = `

                        <a
                            href="${escapeHTML(
                                pregunta.archivoUrl
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="boton btn-archivo">

                            📎 Ver archivo

                        </a>

                    `;

                }

                // =================================================
                // FILA
                // =================================================

                const fila =
                    document.createElement(
                        "tr"
                    );

                fila.innerHTML = `

                    <td>
                        ${indice + 1}
                    </td>

                    <td>
                        ${escapeHTML(
                            pregunta.pregunta
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            pregunta.area
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            pregunta.usuarioCorreo
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            pregunta.cargo
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            pregunta.sedeOperativa
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            fecha
                        )}
                    </td>

                    <td>

                        <span
                            class="estado ${claseEstado}">

                            ${escapeHTML(
                                pregunta.estado
                            )}

                        </span>

                    </td>

                    <td>
                        ${botonArchivo}
                    </td>

                    <td>

                        <a
                            href="detalle-pregunta.html?id=${encodeURIComponent(
                                pregunta.id
                            )}"
                            class="boton btn-ver">

                            Ver

                        </a>

                        ${botonEliminar}

                    </td>

                `;

                tabla.appendChild(
                    fila
                );

            }
        );

        // =====================================================
        // EVENTOS ELIMINAR
        // =====================================================

        document
            .querySelectorAll(
                ".btn-eliminar"
            )
            .forEach(
                (boton) => {

                    boton.addEventListener(
                        "click",
                        () => {

                            eliminarPregunta(
                                boton.dataset.id
                            );

                        }
                    );

                }
            );

    }

    // =====================================================
    // ESCAPAR HTML
    // =====================================================

    function escapeHTML(
        texto
    ) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            texto ?? "";

        return div.innerHTML;

    }

    // =====================================================
    // FILTROS
    // =====================================================

    function aplicarFiltros() {

        const texto =
            document
                .getElementById(
                    "buscador"
                )
                .value
                .toLowerCase()
                .trim();

        const area =
            document
                .getElementById(
                    "filtroArea"
                )
                .value;

        const sede =
            document
                .getElementById(
                    "filtroSede"
                )
                .value;

        const estado =
            document
                .getElementById(
                    "filtroEstado"
                )
                .value;

        const filtradas =
            todasLasPreguntas.filter(
                (pregunta) => {

                    const coincideTexto =

                        pregunta.pregunta
                            .toLowerCase()
                            .includes(texto)

                        ||

                        pregunta.area
                            .toLowerCase()
                            .includes(texto)

                        ||

                        pregunta.usuarioCorreo
                            .toLowerCase()
                            .includes(texto)

                        ||

                        pregunta.usuarioNombre
                            .toLowerCase()
                            .includes(texto)

                        ||

                        pregunta.cargo
                            .toLowerCase()
                            .includes(texto)

                        ||

                        pregunta.sedeOperativa
                            .toLowerCase()
                            .includes(texto);

                    const coincideArea =

                        area ===
                        "TODOS"

                        ||

                        pregunta.area ===
                        area;

                    const coincideSede =

                        sede ===
                        "TODOS"

                        ||

                        pregunta.sedeOperativa ===
                        sede;

                    const coincideEstado =

                        estado ===
                        "TODOS"

                        ||

                        pregunta.estado ===
                        estado;

                    return (

                        coincideTexto

                        &&

                        coincideArea

                        &&

                        coincideSede

                        &&

                        coincideEstado

                    );

                }
            );

        mostrarPreguntas(
            filtradas
        );

    }

    // =====================================================
    // CONTADOR
    // =====================================================

    function actualizarContadorPendientes() {

        const cantidad =
            todasLasPreguntas.filter(
                (pregunta) =>
                    pregunta.estado ===
                    "PENDIENTE"
            ).length;

        const contenedor =
            document.getElementById(
                "notificacionPendientes"
            );

        const contador =
            document.getElementById(
                "contadorPendientes"
            );

        if (

            usuarioActualRol ===
            "ADMINISTRADOR"

            ||

            usuarioActualRol ===
            "RESPONDEDOR"

        ) {

            contador.textContent =
                cantidad;

            contenedor.style.display =
                "block";

        } else {

            contenedor.style.display =
                "none";

        }

    }

    // =====================================================
    // ELIMINAR PREGUNTA
    // =====================================================

    async function eliminarPregunta(
        id
    ) {

        if (
            usuarioActualRol !==
            "ADMINISTRADOR"
        ) {

            alert(
                "No tiene permisos para eliminar preguntas."
            );

            return;

        }

        const confirmar =
            confirm(

                "¿Está seguro de eliminar esta pregunta?\n\n"

                +

                "Esta acción no se puede deshacer."

            );

        if (!confirmar) {

            return;

        }

        try {

            await deleteDoc(

                doc(
                    db,
                    "preguntas",
                    id
                )

            );

            alert(
                "Pregunta eliminada correctamente."
            );

            await cargarPreguntas();

        } catch (error) {

            console.error(
                "Error eliminando pregunta:",
                error
            );

            alert(

                "No se pudo eliminar la pregunta.\n\n"

                +

                error.message

            );

        }

    }

    // =====================================================
    // ESTILOS EXCEL
    // =====================================================

    const bordeGris = {

        top: {
            style: "thin",
            color: {
                rgb: "B7B7B7"
            }
        },

        bottom: {
            style: "thin",
            color: {
                rgb: "B7B7B7"
            }
        },

        left: {
            style: "thin",
            color: {
                rgb: "B7B7B7"
            }
        },

        right: {
            style: "thin",
            color: {
                rgb: "B7B7B7"
            }
        }

    };

    const bordeBlanco = {

        top: {
            style: "thin",
            color: {
                rgb: "FFFFFF"
            }
        },

        bottom: {
            style: "thin",
            color: {
                rgb: "FFFFFF"
            }
        },

        left: {
            style: "thin",
            color: {
                rgb: "FFFFFF"
            }
        },

        right: {
            style: "thin",
            color: {
                rgb: "FFFFFF"
            }
        }

    };

    // =====================================================
    // EXPORTAR EXCEL
    // =====================================================

    async function exportarExcel() {

        try {

            if (
                typeof XLSX ===
                "undefined"
            ) {

                throw new Error(
                    "No se pudo cargar la librería para generar Excel."
                );

            }

            if (
                todasLasPreguntas.length ===
                0
            ) {

                alert(
                    "No existen preguntas para exportar."
                );

                return;

            }

            // =================================================
            // FILTROS
            // =================================================

            const texto =
                document
                    .getElementById(
                        "buscador"
                    )
                    .value
                    .toLowerCase()
                    .trim();

            const areaSeleccionada =
                document
                    .getElementById(
                        "filtroArea"
                    )
                    .value;

            const sedeSeleccionada =
                document
                    .getElementById(
                        "filtroSede"
                    )
                    .value;

            const estadoSeleccionado =
                document
                    .getElementById(
                        "filtroEstado"
                    )
                    .value;

            // =================================================
            // APLICAR FILTROS
            // =================================================

            const preguntasFiltradas =
                todasLasPreguntas.filter(
                    (pregunta) => {

                        const coincideTexto =

                            pregunta.pregunta
                                .toLowerCase()
                                .includes(texto)

                            ||

                            pregunta.area
                                .toLowerCase()
                                .includes(texto)

                            ||

                            pregunta.usuarioCorreo
                                .toLowerCase()
                                .includes(texto)

                            ||

                            pregunta.usuarioNombre
                                .toLowerCase()
                                .includes(texto)

                            ||

                            pregunta.cargo
                                .toLowerCase()
                                .includes(texto)

                            ||

                            pregunta.sedeOperativa
                                .toLowerCase()
                                .includes(texto);

                        const coincideArea =

                            areaSeleccionada ===
                            "TODOS"

                            ||

                            pregunta.area ===
                            areaSeleccionada;

                        const coincideSede =

                            sedeSeleccionada ===
                            "TODOS"

                            ||

                            pregunta.sedeOperativa ===
                            sedeSeleccionada;

                        const coincideEstado =

                            estadoSeleccionado ===
                            "TODOS"

                            ||

                            pregunta.estado ===
                            estadoSeleccionado;

                        return (

                            coincideTexto

                            &&

                            coincideArea

                            &&

                            coincideSede

                            &&

                            coincideEstado

                        );

                    }
                );

            if (
                preguntasFiltradas.length ===
                0
            ) {

                alert(
                    "No existen registros para exportar."
                );

                return;

            }

            // =================================================
            // OBTENER RESPUESTAS
            // =================================================

            const respuestasSnapshot =
                await getDocs(

                    collection(
                        db,
                        "respuestas"
                    )

                );

            const respuestas = {};

            respuestasSnapshot.forEach(
                (documento) => {

                    const datos =
                        documento.data();

                    if (
                        datos.preguntaId
                    ) {

                        respuestas[
                            datos.preguntaId
                        ] = datos;

                    }

                }
            );

            // =================================================
            // FECHA Y HORA DE EXPORTACIÓN
            // =================================================

            const ahora =
                new Date();

            const fechaGeneracion =
                ahora.toLocaleString(
                    "es-PE"
                );

            // =================================================
            // ESTRUCTURA EXCEL
            // =================================================

            const datosExcel = [

                // FILA 1

                [

                    "APLICACIÓN DE LA PRUEBA NACIONAL DE LOS CONCURSOS PÚBLICOS PARA EL ASCENSO DE ESCALA DE LOS PROFESORES DE EDUCACIÓN BÁSICA Y DE LOS QUE LABORAN EN INSTITUCIONES EDUCATIVAS ADMINISTRADAS POR EL MINISTERIO DE DEFENSA Y EL MINISTERIO DEL INTERIOR, EN LA CARRERA PÚBLICA MAGISTERIAL, PARA EL AÑO 2026"

                ],

                // FILA 2

                [

                    "MÓDULO DE DERIVACIÓN DE CONSULTAS DE CAMPO"

                ],

                // FILA 3

                [

                    "REGISTRO",
                    "",
                    "",
                    "",
                    "",

                    "ATENCIÓN DE CONSULTA",
                    "",
                    "",
                    ""

                ],

                // FILA 4

                [

                    "FECHA",

                    "SEDE OPERATIVA",

                    "CONSULTA",

                    "EVIDENCIA",

                    "NOMBRE DEL RESPONSABLE",

                    "FECHA",

                    "RESPUESTA",

                    "ÁREA QUE ATIENDE",

                    "NOMBRE DE RESPONSABLE"

                ]

            ];

            // =================================================
            // REGISTROS
            // =================================================

            preguntasFiltradas.forEach(
                (pregunta) => {

                    // -----------------------------------------
                    // FECHA PREGUNTA
                    // -----------------------------------------

                    let fechaPregunta = "";

                    if (

                        pregunta.fecha

                        &&

                        typeof pregunta.fecha.toDate ===
                        "function"

                    ) {

                        fechaPregunta =
                            pregunta.fecha
                                .toDate()
                                .toLocaleString(
                                    "es-PE"
                                );

                    }

                    // -----------------------------------------
                    // RESPUESTA
                    // -----------------------------------------

                    const respuesta =
                        respuestas[
                            pregunta.id
                        ];

                    let fechaRespuesta = "";

                    let textoRespuesta = "";

                    let cargoRespondedor = "";

                    let nombreRespondedor = "";

                    if (
                        respuesta
                    ) {

                        textoRespuesta =
                            respuesta.respuesta
                            ||
                            "";

                        if (

                            respuesta.fecha

                            &&

                            typeof respuesta.fecha.toDate ===
                            "function"

                        ) {

                            fechaRespuesta =
                                respuesta.fecha
                                    .toDate()
                                    .toLocaleString(
                                        "es-PE"
                                    );

                        }

                        const usuarioRespondedor =
                            usuarios[
                                respuesta.usuarioId
                            ]
                            ||
                            {};

                        cargoRespondedor =

                            respuesta.cargo

                            ||

                            usuarioRespondedor.cargo

                            ||

                            "";

                        nombreRespondedor =

                            respuesta.nombre

                            ||

                            respuesta.nombreRespondedor

                            ||

                            usuarioRespondedor.nombre

                            ||

                            respuesta.usuarioCorreo

                            ||

                            "";

                    }

                    // -----------------------------------------
                    // CONSULTADOR
                    // -----------------------------------------

                    const usuarioConsultador =
                        usuarios[
                            pregunta.usuarioId
                        ]
                        ||
                        {};

                    const sedeOperativa =

                        pregunta.sedeOperativa

                        ||

                        usuarioConsultador.sedeOperativa

                        ||

                        "";

                    const nombreConsultador =

                        pregunta.usuarioNombre

                        ||

                        pregunta.nombreConsultador

                        ||

                        usuarioConsultador.nombre

                        ||

                        pregunta.usuarioCorreo

                        ||

                        "";

                    // -----------------------------------------
                    // EVIDENCIA
                    // -----------------------------------------

                    // IMPORTANTE:
                    // Se coloca el URL real del archivo
                    // y no el nombre del archivo.

                    let evidencia = "";

                    if (
                        pregunta.archivoUrl
                    ) {

                        evidencia =
                            pregunta.archivoUrl;

                    }

                    // -----------------------------------------
                    // FILA
                    // -----------------------------------------

                    datosExcel.push([

                        fechaPregunta,

                        sedeOperativa,

                        pregunta.pregunta
                        ||
                        "",

                        evidencia,

                        nombreConsultador,

                        fechaRespuesta,

                        textoRespuesta,

                        cargoRespondedor,

                        nombreRespondedor

                    ]);

                }
            );

            // =================================================
            // PIE DE TABLA
            // =================================================

            // Fila en blanco después de los registros

            datosExcel.push([]);

            // ÚNICAMENTE fecha y hora de exportación

            datosExcel.push([

                "Fecha y hora de exportación",

                fechaGeneracion

            ]);

            // =================================================
            // CREAR HOJA
            // =================================================

            const hoja =
                XLSX.utils.aoa_to_sheet(
                    datosExcel
                );

            // =================================================
            // ANCHOS
            // =================================================

            hoja["!cols"] = [

                { wch: 20 },

                { wch: 30 },

                { wch: 60 },

                { wch: 55 },

                { wch: 30 },

                { wch: 20 },

                { wch: 65 },

                { wch: 35 },

                { wch: 30 }

            ];

            // =================================================
            // COMBINACIONES
            // =================================================

            hoja["!merges"] = [

                // TÍTULO

                {

                    s: {
                        r: 0,
                        c: 0
                    },

                    e: {
                        r: 0,
                        c: 8
                    }

                },

                // SUBTÍTULO

                {

                    s: {
                        r: 1,
                        c: 0
                    },

                    e: {
                        r: 1,
                        c: 8
                    }

                },

                // CONSULTADOR

                {

                    s: {
                        r: 2,
                        c: 0
                    },

                    e: {
                        r: 2,
                        c: 4
                    }

                },

                // RESPONDEDOR

                {

                    s: {
                        r: 2,
                        c: 5
                    },

                    e: {
                        r: 2,
                        c: 8
                    }

                }

            ];

            // =================================================
            // COLORES
            // =================================================

            const azul =
                "002060";

            const blanco =
                "FFFFFF";

            const negro =
                "000000";

            // =================================================
            // ESTILO TÍTULO
            // =================================================

            hoja["A1"].s = {

                font: {

                    bold: true,

                    sz: 11,

                    color: {
                        rgb: negro
                    }

                },

                alignment: {

                    horizontal: "center",

                    vertical: "center",

                    wrapText: true

                }

            };

            // =================================================
            // ESTILO SUBTÍTULO
            // =================================================

            hoja["A2"].s = {

                font: {

                    bold: true,

                    sz: 18,

                    color: {
                        rgb: negro
                    }

                },

                alignment: {

                    horizontal: "center",

                    vertical: "center"

                }

            };

            // =================================================
            // CABECERAS AGRUPADAS
            // FILA 3
            // =================================================

            for (
                let columna = 0;
                columna < 9;
                columna++
            ) {

                const celda =
                    XLSX.utils.encode_cell({

                        r: 2,

                        c: columna

                    });

                if (
                    hoja[celda]
                ) {

                    hoja[celda].s = {

                        fill: {

                            fgColor: {

                                rgb: azul

                            }

                        },

                        font: {

                            bold: true,

                            color: {

                                rgb: blanco

                            },

                            sz: 11

                        },

                        alignment: {

                            horizontal:
                                "center",

                            vertical:
                                "center"

                        },

                        border:
                            bordeBlanco

                    };

                }

            }

            // =================================================
            // CABECERAS
            // FILA 4
            // =================================================

            for (
                let columna = 0;
                columna < 9;
                columna++
            ) {

                const celda =
                    XLSX.utils.encode_cell({

                        r: 3,

                        c: columna

                    });

                if (
                    hoja[celda]
                ) {

                    hoja[celda].s = {

                        fill: {

                            fgColor: {

                                rgb: azul

                            }

                        },

                        font: {

                            bold: true,

                            color: {

                                rgb: blanco

                            },

                            sz: 10

                        },

                        alignment: {

                            horizontal:
                                "center",

                            vertical:
                                "center",

                            wrapText: true

                        },

                        border:
                            bordeBlanco

                    };

                }

            }

            // =================================================
            // BORDES DE DATOS
            // =================================================

            for (

                let fila = 4;

                fila <
                4 + preguntasFiltradas.length;

                fila++

            ) {

                for (

                    let columna = 0;

                    columna < 9;

                    columna++

                ) {

                    const celda =
                        XLSX.utils.encode_cell({

                            r: fila,

                            c: columna

                        });

                    if (
                        hoja[celda]
                    ) {

                        hoja[celda].s = {

                            alignment: {

                                vertical:
                                    "top",

                                wrapText:
                                    true

                            },

                            border:
                                bordeGris

                        };

                    }

                }

            }

            // =================================================
            // ESTILO DEL PIE DE TABLA
            // =================================================

            const filaPie =
                datosExcel.length - 1;

            for (

                let columna = 0;

                columna < 2;

                columna++

            ) {

                const celda =
                    XLSX.utils.encode_cell({

                        r: filaPie,

                        c: columna

                    });

                if (
                    hoja[celda]
                ) {

                    hoja[celda].s = {

                        font: {

                            bold:
                                columna === 0

                        },

                        alignment: {

                            vertical:
                                "center",

                            wrapText:
                                true

                        },

                        border:
                            bordeGris

                    };

                }

            }

            // =================================================
            // ALTURA DE FILAS
            // =================================================

            hoja["!rows"] = [

                {
                    hpt: 45
                },

                {
                    hpt: 32
                },

                {
                    hpt: 25
                },

                {
                    hpt: 35
                }

            ];

            // =================================================
            // CONGELAR CABECERA
            // =================================================

            hoja["!freeze"] = {

                xSplit: 0,

                ySplit: 4

            };

            // =================================================
            // CREAR LIBRO
            // =================================================

            const libro =
                XLSX.utils.book_new();

            XLSX.utils.book_append_sheet(

                libro,

                hoja,

                "Consultas de Campo"

            );

            // =================================================
            // NOMBRE DEL ARCHIVO
            // =================================================

            const fechaArchivo =
                ahora
                    .toISOString()
                    .slice(
                        0,
                        10
                    );

            // =================================================
            // GENERAR ARCHIVO
            // =================================================

            XLSX.writeFile(

                libro,

                `MODULO_DERIVACION_CONSULTAS_${fechaArchivo}.xlsx`

            );

        } catch (error) {

            console.error(
                "Error exportando Excel:",
                error
            );

            alert(

                "No se pudo generar el archivo Excel.\n\n"

                +

                error.message

            );

        }

    }

    // =====================================================
    // EVENTOS
    // =====================================================

    document
        .getElementById(
            "buscador"
        )
        .addEventListener(
            "input",
            aplicarFiltros
        );

    document
        .getElementById(
            "filtroArea"
        )
        .addEventListener(
            "change",
            aplicarFiltros
        );

    document
        .getElementById(
            "filtroSede"
        )
        .addEventListener(
            "change",
            aplicarFiltros
        );

    document
        .getElementById(
            "filtroEstado"
        )
        .addEventListener(
            "change",
            aplicarFiltros
        );

    document
        .getElementById(
            "btnExcel"
        )
        .addEventListener(
            "click",
            exportarExcel
        );

    // =====================================================
    // AUTENTICACIÓN
    // =====================================================

    onAuthStateChanged(

        auth,

        async (user) => {

            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }

            try {

                usuarioActualRol =
                    await obtenerRolUsuario(
                        user
                    );

                console.log(
                    "Usuario:",
                    user.email
                );

                console.log(
                    "Rol:",
                    usuarioActualRol
                );

                // CARGAR SEDES

                cargarSedesFiltro();

                // CARGAR USUARIOS

                await cargarUsuarios();

                // CARGAR PREGUNTAS

                await cargarPreguntas();

            } catch (error) {

                console.error(
                    "Error inicializando:",
                    error
                );

                document
                    .getElementById(
                        "tablaPreguntas"
                    )
                    .innerHTML = `

                        <tr>

                            <td
                                colspan="10"
                                class="mensaje error">

                                <strong>
                                    Error al iniciar la página.
                                </strong>

                                <br><br>

                                ${escapeHTML(
                                    error.message
                                )}

                            </td>

                        </tr>

                    `;

            }

        }

    );

</script>
