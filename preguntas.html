<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Preguntas</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .button {
            background: #1f4e78;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            text-decoration: none;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f2f5;
        }

        .estado {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 13px;
        }

        .pendiente {
            background: #fff3cd;
        }

        .respondida {
            background: #d1e7dd;
        }

    </style>

</head>

<body>

<header>

    <h2>
        Preguntas y Respuestas
    </h2>

</header>


<main class="container">

    <div class="toolbar">

        <h2>
            Preguntas
        </h2>

        <a
            href="nueva-pregunta.html"
            class="button">

            + Nueva pregunta

        </a>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Pregunta</th>

                    <th>Categoría</th>

                    <th>Fecha</th>

                    <th>Estado</th>

                    <th>Acción</th>

                </tr>

            </thead>

            <tbody id="listaPreguntas">

                <tr>

                    <td colspan="6">
                        Cargando preguntas...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>
<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // CONFIGURACIÓN FIREBASE

    const firebaseConfig = {

        apiKey: "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",
        authDomain: "sistema-preguntas-respuestas.firebaseapp.com",
        projectId: "sistema-preguntas-respuestas",
        storageBucket: "sistema-preguntas-respuestas.firebasestorage.app",
        messagingSenderId: "606737336904",
        appId: "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    // Verificar sesión

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }


        cargarPreguntas();

    });


    // Cargar preguntas

    async function cargarPreguntas() {

        const lista =
            document.getElementById(
                "listaPreguntas"
            );


        try {

            const consulta =
                query(
                    collection(db, "preguntas"),
                    orderBy("fecha", "desc")
                );


            const resultado =
                await getDocs(consulta);


            lista.innerHTML = "";


            if (resultado.empty) {

                lista.innerHTML = `
                    <tr>
                        <td colspan="6">
                            No existen preguntas registradas.
                        </td>
                    </tr>
                `;

                return;
            }


            resultado.forEach((documento) => {

                const datos =
                    documento.data();


                let fecha = "";

                if (datos.fecha) {

                    fecha =
                        datos.fecha
                            .toDate()
                            .toLocaleString(
                                "es-PE"
                            );

                }


                const estado =
                    datos.estado || "PENDIENTE";


                const claseEstado =
                    estado === "RESPONDIDA"
                        ? "respondida"
                        : "pendiente";


                const fila = `

                    <tr>

                        <td>
                            ${documento.id.substring(0, 8)}
                        </td>

                        <td>
                            ${datos.pregunta}
                        </td>

                        <td>
                            ${datos.categoria}
                        </td>

                        <td>
                            ${fecha}
                        </td>

                        <td>

                            <span
                                class="estado ${claseEstado}">

                                ${estado}

                            </span>

                        </td>

                        <td>

                        <a href="detalle-pregunta.html?id=${documento.id}">
                        Ver
                        </a>

                        </td>

                    </tr>

                `;


                lista.innerHTML += fila;

            });


        } catch (error) {

            console.error(error);

            lista.innerHTML = `

                <tr>

                    <td colspan="6">

                        Error al cargar las preguntas.

                    </td>

                </tr>

            `;

        }

    }

</script>
</body>

</html>
