<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Preguntas</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .button {
            background: #1f4e78;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            text-decoration: none;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f2f5;
        }

        .estado {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 13px;
        }

        .pendiente {
            background: #fff3cd;
        }

        .respondida {
            background: #d1e7dd;
        }

        .filtros {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .filtros input,
        .filtros select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        
        .filtros input {
            flex: 1;
        }

        .btn-exportar {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #198754;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-exportar:hover {
            background: #157347;
        }

    </style>

</head>

<body>

<header>

    <h2>
        Preguntas y Respuestas
    </h2>

</header>


<main class="container">

    <div class="toolbar">

        <h2>
            Preguntas
        </h2>

        <a
            href="nueva-pregunta.html"
            class="button">

            + Nueva pregunta                   
        </a>

        <button
            type="button"
            id="btnExportarExcel"
            class="btn-exportar">
        
            📊 EXPORTAR A EXCEL
        
        </button>

    </div>

    <div class="filtros">

    <input
        type="text"
        id="buscador"
        placeholder="🔎 Buscar pregunta..."
    >

    <select id="filtroEstado">

        <option value="TODOS">
            Todos los estados
        </option>

        <option value="PENDIENTE">
            Pendientes
        </option>

        <option value="RESPONDIDA">
            Respondidas
        </option>

    </select>

</div>


    <div class="table-container">

        <table>

            <thead>

                <tr>
                
                    <th>ID</th>
                
                    <th>Pregunta</th>
                
                    <th>Categoría</th>
                
                    <th>Usuario</th>
                
                    <th>Fecha</th>
                
                    <th>Estado</th>
                
                    <th>Acción</th>
                
                </tr>

            </thead>

            <tbody id="listaPreguntas">

                <tr>

                    <td colspan="7">
                        Cargando preguntas...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>
<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // CONFIGURACIÓN FIREBASE

    const firebaseConfig = {

        apiKey: "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",
        authDomain: "sistema-preguntas-respuestas.firebaseapp.com",
        projectId: "sistema-preguntas-respuestas",
        storageBucket: "sistema-preguntas-respuestas.firebasestorage.app",
        messagingSenderId: "606737336904",
        appId: "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);
        let todasLasPreguntas = [];


    // Verificar sesión

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }


        cargarPreguntas();

    });


    // Cargar preguntas
        function mostrarPreguntas() {
        
            const lista =
                document.getElementById(
                    "listaPreguntas"
                );
        
        
            const texto =
                document
                    .getElementById("buscador")
                    .value
                    .toLowerCase()
                    .trim();
        
        
            const estadoSeleccionado =
                document
                    .getElementById("filtroEstado")
                    .value;
        
        
            const preguntasFiltradas =
                todasLasPreguntas.filter(
                    function(pregunta) {
        
        
                        // ==========================
                        // BUSCADOR
                        // ==========================
        
                        const coincideTexto =
        
                            pregunta.pregunta
                                .toLowerCase()
                                .includes(texto)
        
                            ||
        
                            pregunta.categoria
                                .toLowerCase()
                                .includes(texto)
        
                            ||
        
                            pregunta.usuarioCorreo
                                .toLowerCase()
                                .includes(texto);
        
        
                        // ==========================
                        // ESTADO
                        // ==========================
        
                        const coincideEstado =
        
                            estadoSeleccionado ===
                            "TODOS"
        
                            ||
        
                            pregunta.estado ===
                            estadoSeleccionado;
        
        
                        return (
                            coincideTexto &&
                            coincideEstado
                        );
        
                    }
                );
        
        
            lista.innerHTML = "";
        
        
            if (
                preguntasFiltradas.length === 0
            ) {
        
                lista.innerHTML = `
        
                    <tr>
        
                        <td colspan="7">
        
                            No se encontraron preguntas.
        
                        </td>
        
                    </tr>
        
                `;
        
                return;
        
            }
        
        
            preguntasFiltradas.forEach(
                function(pregunta) {
        
        
                    let fecha = "-";
        
        
                    if (pregunta.fecha) {
        
                        fecha =
                            pregunta.fecha
                                .toDate()
                                .toLocaleString(
                                    "es-PE"
                                );
        
                    }
        
        
                    const claseEstado =
        
                        pregunta.estado ===
                        "RESPONDIDA"
        
                            ? "respondida"
        
                            : "pendiente";
        
        
                    const fila = `
        
                        <tr>
        
                            <td>
                                ${pregunta.id.substring(0,8)}
                            </td>
        
                            <td>
                                ${pregunta.pregunta}
                            </td>
        
                            <td>
                                ${pregunta.categoria}
                            </td>
        
                            <td>
                                ${pregunta.usuarioCorreo}
                            </td>
        
                            <td>
                                ${fecha}
                            </td>
        
                            <td>
        
                                <span
                                    class="estado ${claseEstado}">
        
                                    ${pregunta.estado}
        
                                </span>
        
                            </td>
        
                            <td>
        
                                <a
                                    href="detalle-pregunta.html?id=${pregunta.id}">
        
                                    Ver
        
                                </a>
        
                            </td>
        
                        </tr>
        
                    `;
        
        
                    lista.innerHTML += fila;
        
                }
            );
        
        }
    

async function cargarPreguntas() {

    const lista =
        document.getElementById(
            "listaPreguntas"
        );


    try {

        const consulta =
            query(
                collection(db, "preguntas"),
                orderBy("fecha", "desc")
            );


        const resultado =
            await getDocs(consulta);


        todasLasPreguntas = [];


        resultado.forEach(
            function(documento) {

                const datos =
                    documento.data();


                todasLasPreguntas.push({

                    id:
                        documento.id,

                    pregunta:
                        datos.pregunta || "",

                    categoria:
                        datos.categoria || "",

                    usuarioCorreo:
                        datos.usuarioCorreo || "",

                    estado:
                        datos.estado || "PENDIENTE",

                    fecha:
                        datos.fecha || null

                });

            }
        );


        mostrarPreguntas();


    } catch (error) {

        console.error(error);


        lista.innerHTML = `

            <tr>

                <td colspan="7">

                    Error al cargar las preguntas.

                </td>

            </tr>

        `;

    }

}

    document
        .getElementById("buscador")
        .addEventListener(
            "input",
            mostrarPreguntas
        );
    
    
    document
        .getElementById("filtroEstado")
        .addEventListener(
            "change",
            mostrarPreguntas
        );    
</script>
</body>

</html>
