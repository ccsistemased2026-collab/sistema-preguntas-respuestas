</head>

<body>

<header>

    </h2>

</header>


<main class="container">

    <div class="toolbar">

        <h2>

        </h2>
        <a href="dashboard.html" class="btn-dashboard">

        <a

            🔔 Preguntas pendientes:

</div>


    <div class="table-container">

        <table>

            <thead>

                <tr>
                
                    <th>ID</th>
                
                    <th>Pregunta</th>
                
                    <th>Categoría</th>
                
                    <th>Usuario</th>
                
                    <th>Fecha</th>

            </thead>

            <tbody id="listaPreguntas">

                <tr>

                    <td colspan="7">

</main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>   
<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy,
        doc,
        getDoc,
        where,
        deleteDoc
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // CONFIGURACIÓN FIREBASE

    const firebaseConfig = {

        apiKey: "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",
        authDomain: "sistema-preguntas-respuestas.firebaseapp.com",
        projectId: "sistema-preguntas-respuestas",
        storageBucket: "sistema-preguntas-respuestas.firebasestorage.app",
        messagingSenderId: "606737336904",
        appId: "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);
        let todasLasPreguntas = [];
        let usuarioActualRol = "";
    // ==========================================
// CONTADOR DE PREGUNTAS PENDIENTES
// ==========================================

async function actualizarContadorPendientes(user) {

    try {

        // Obtener perfil del usuario

        const usuarioRef =
            doc(
                db,
                "usuarios",
                user.uid
            );

        const usuarioSnapshot =
            await getDoc(
                usuarioRef
            );


        if (!usuarioSnapshot.exists()) {

            return;

        }


        const usuario =
            usuarioSnapshot.data();


        // Solo RESPONDEDOR y ADMINISTRADOR

        if (
            usuario.rol !== "RESPONDEDOR" &&
            usuario.rol !== "ADMINISTRADOR"
        ) {

            return;

        }


        // Buscar preguntas pendientes

        const consulta =
            query(
                collection(
                    db,
                    "preguntas"
                ),
                where(
                    "estado",
                    "==",
                    "PENDIENTE"
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        const cantidad =
            resultado.size;


        // Mostrar contador

        document.getElementById(
            "contadorPendientes"
        ).textContent =
            cantidad;


        document.getElementById(
            "notificacionPendientes"
        ).style.display =
            "block";


    } catch (error) {

        console.error(
            "Error contador:",
            error
        );

    }

}


    // Verificar sesión

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }

        try {

            // Obtener perfil del usuario

            const usuarioRef =
                doc(
                    db,
                    "usuarios",
                    user.uid
                );


            const usuarioSnapshot =
                await getDoc(
                    usuarioRef
                );


            if (
                usuarioSnapshot.exists()
            ) {

                const datosUsuario =
                    usuarioSnapshot.data();


                usuarioActualRol =
                    datosUsuario.rol
                    || "";

            }


            console.log(
                "Rol actual:",
                usuarioActualRol
            );


            await cargarPreguntas();


        } catch (error) {

            console.error(
                "Error obteniendo rol:",
                error
            );

            alert(
                "No se pudo verificar el rol del usuario."
            );

        }

    }
);
    
    
            // Actualizar cada 30 segundos
    
            setInterval(
                function() {
    
                    actualizarContadorPendientes(
                        user
                    );
    
                },
                30000
            );
    
        }
    );

    if (usuarioActualRol === "ADMINISTRADOR") {

    botonEliminar = `
        <button
            class="btn-eliminar"
            onclick="eliminarPregunta('${pregunta.id}')">

            🗑️ ELIMINAR

        </button>
    `;

}
    // Cargar preguntas
        function mostrarPreguntas() {
        
            const lista =
                document.getElementById(
                    "listaPreguntas"
                );
        
        
            const texto =
                document
                    .getElementById("buscador")
                    .value
                    .toLowerCase()
                    .trim();
        
        
            const estadoSeleccionado =
                document
                    .getElementById("filtroEstado")
                    .value;
        
        
            const preguntasFiltradas =
                todasLasPreguntas.filter(
                    function(pregunta) {
        
        
                        // ==========================
                        // BUSCADOR
                        // ==========================
        
                        const coincideTexto =
        
                            pregunta.pregunta
                                .toLowerCase()
                                .includes(texto)
        
                            ||
        
                            pregunta.categoria
                                .toLowerCase()
                                .includes(texto)
        
                            ||
        
                            pregunta.usuarioCorreo
                                .toLowerCase()
                                .includes(texto);
        
        
                        // ==========================
                        // ESTADO
                        // ==========================
        
                        const coincideEstado =
        
                            estadoSeleccionado ===
                            "TODOS"
        
                            ||
        
                            pregunta.estado ===
                            estadoSeleccionado;
        
        
                        return (
                            coincideTexto &&
                            coincideEstado
                        );
        
                    }
                );
        
        
            lista.innerHTML = "";
        
        
            if (
                preguntasFiltradas.length === 0
            ) {
        
                lista.innerHTML = `
        
                    <tr>
        
                        <td colspan="7">
        
                            No se encontraron preguntas.
        
                        </td>
        
                    </tr>
        
                `;
        
                return;
        
            }
        
        
            preguntasFiltradas.forEach(
                function(pregunta) {
        
        
                    let fecha = "-";
        
        
                    if (pregunta.fecha) {
        
                        fecha =
                            pregunta.fecha
                                .toDate()
                                .toLocaleString(
                                    "es-PE"
                                );
        
                    }
        
        
                    const claseEstado =
        
                        pregunta.estado ===
                        "RESPONDIDA"
        
                            ? "respondida"
        
                            : "pendiente";
        
        
                    const fila = `
        
                        <tr>
        
                            <td>
                                ${pregunta.id.substring(0,8)}
                            </td>
        
                            <td>
                                ${pregunta.pregunta}
                            </td>
        
                            <td>
                                ${pregunta.categoria}
                            </td>
        
                            <td>
                                ${pregunta.usuarioCorreo}
                            </td>
        
                            <td>
                                ${fecha}
                            </td>
        
                            <td>
        
                                <span
                                    class="estado ${claseEstado}">
        
                                    ${pregunta.estado}
        
                                </span>
        
                            </td>
        
                            <td>
                            
                                <a
                                    href="detalle-pregunta.html?id=${pregunta.id}">
                            
                                    Ver
                            
                                </a>
                            
                            
                                ${
                                    usuarioActualRol === "ADMINISTRADOR"
                            
                                    ?
                            
                                    `
                                    <button
                                        type="button"
                                        class="btn-eliminar"
                                        onclick="eliminarPregunta('${pregunta.id}')">
                            
                                        🗑️ Eliminar
                            
                                    </button>
                                    `
                            
                                    :
                            
                                    ""
                            
                                }
                            
                            </td>
        
                        </tr>
        
                    `;
        
        
                    lista.innerHTML += fila;
        
                }
            );
        
        }
    

async function cargarPreguntas() {

    const lista =
        document.getElementById(
            "listaPreguntas"
        );


    try {

        const consulta =
            query(
                collection(db, "preguntas"),
                orderBy("fecha", "desc")
            );


        const resultado =
            await getDocs(consulta);


        todasLasPreguntas = [];


        resultado.forEach(
            function(documento) {

                const datos =
                    documento.data();


                todasLasPreguntas.push({

                    id:
                        documento.id,

                    pregunta:
                        datos.pregunta || "",

                    categoria:
                        datos.categoria || "",

                    usuarioCorreo:
                        datos.usuarioCorreo || "",

                    estado:
                        datos.estado || "PENDIENTE",

                    fecha:
                        datos.fecha || null

                });

            }
        );


        mostrarPreguntas();


    } catch (error) {

        console.error(error);


        lista.innerHTML = `

            <tr>

                <td colspan="7">

                    Error al cargar las preguntas.

                </td>

            </tr>

        `;

    }

}

    document
        .getElementById("buscador")
        .addEventListener(
            "input",
            mostrarPreguntas
        );
    
    
    document
        .getElementById("filtroEstado")
        .addEventListener(
            "change",
            mostrarPreguntas
        );  

    // ==========================================
// EXPORTAR PREGUNTAS Y RESPUESTAS A EXCEL
// ==========================================

document
    .getElementById("btnExportarExcel")
    .addEventListener(
        "click",
        exportarExcel
    );


async function exportarExcel() {

    try {

        // ======================================
        // VERIFICAR PREGUNTAS
        // ======================================

        if (
            todasLasPreguntas.length === 0
        ) {

            alert(
                "No existen preguntas para exportar."
            );

            return;

        }


        // ======================================
        // OBTENER RESPUESTAS
        // ======================================

        const respuestasSnapshot =
            await getDocs(
                collection(
                    db,
                    "respuestas"
                )
            );


        const respuestas = {};


        respuestasSnapshot.forEach(
            function(documento) {

                const datos =
                    documento.data();


                respuestas[
                    datos.preguntaId
                ] = datos;

            }
        );


        // ======================================
        // OBTENER FILTROS
        // ======================================

        const texto =
            document
                .getElementById(
                    "buscador"
                )
                .value
                .toLowerCase()
                .trim();


        const estadoSeleccionado =
            document
                .getElementById(
                    "filtroEstado"
                )
                .value;


        // ======================================
        // FILTRAR
        // ======================================

        const preguntasFiltradas =
            todasLasPreguntas.filter(
                function(pregunta) {


                    const coincideTexto =

                        pregunta.pregunta
                            .toLowerCase()
                            .includes(texto)

                        ||

                        pregunta.categoria
                            .toLowerCase()
                            .includes(texto)

                        ||

                        pregunta.usuarioCorreo
                            .toLowerCase()
                            .includes(texto);


                    const coincideEstado =

                        estadoSeleccionado ===
                        "TODOS"

                        ||

                        pregunta.estado ===
                        estadoSeleccionado;


                    return (
                        coincideTexto &&
                        coincideEstado
                    );

                }
            );


        if (
            preguntasFiltradas.length === 0
        ) {

            alert(
                "No existen registros para exportar."
            );

            return;

        }


        // ======================================
        // FECHA DE GENERACIÓN
        // ======================================

        const ahora =
            new Date();


        const fechaGeneracion =
            ahora.toLocaleString(
                "es-PE"
            );


        // ======================================
        // DATOS
        // ======================================

        const filas = [];


        preguntasFiltradas.forEach(
            function(
                pregunta,
                indice
            ) {


                const respuesta =
                    respuestas[
                        pregunta.id
                    ];


                let fechaPregunta =
                    "";


                if (
                    pregunta.fecha
                ) {

                    fechaPregunta =
                        pregunta.fecha
                            .toDate()
                            .toLocaleString(
                                "es-PE"
                            );

                }


                let textoRespuesta =
                    "";


                let respondidoPor =
                    "";


                let fechaRespuesta =
                    "";


                if (respuesta) {

                    textoRespuesta =
                        respuesta.respuesta
                        || "";


                    respondidoPor =
                        respuesta.usuarioCorreo
                        || "";


                    if (
                        respuesta.fecha
                    ) {

                        fechaRespuesta =
                            respuesta.fecha
                                .toDate()
                                .toLocaleString(
                                    "es-PE"
                                );

                    }

                }


                filas.push([

                    indice + 1,

                    pregunta.id,

                    pregunta.pregunta,

                    pregunta.categoria,

                    pregunta.usuarioCorreo,

                    fechaPregunta,

                    pregunta.estado,

                    textoRespuesta,

                    respondidoPor,

                    fechaRespuesta

                ]);

            }
        );


        // ======================================
        // CONSTRUIR HOJA
        // ======================================

        const datosHoja = [

            [
                "BANCO DE PREGUNTAS Y RESPUESTAS"
            ],

            [
                "Fecha de generación:",
                fechaGeneracion
            ],

            [
                "Estado filtrado:",
                estadoSeleccionado
            ],

            [
                "Texto buscado:",
                texto || "-"
            ],

            [
                "Total de registros:",
                preguntasFiltradas.length
            ],

            [],

            [

                "N°",

                "ID",

                "PREGUNTA",

                "CATEGORÍA",

                "USUARIO",

                "FECHA PREGUNTA",

                "ESTADO",

                "RESPUESTA",

                "RESPONDIDO POR",

                "FECHA RESPUESTA"

            ],

            ...filas

        ];


        const hoja =
            XLSX.utils.aoa_to_sheet(
                datosHoja
            );


        // ======================================
        // ANCHO DE COLUMNAS
        // ======================================

        hoja["!cols"] = [

            { wch: 6 },

            { wch: 15 },

            { wch: 60 },

            { wch: 20 },

            { wch: 30 },

            { wch: 22 },

            { wch: 15 },

            { wch: 70 },

            { wch: 30 },

            { wch: 22 }

        ];


        // ======================================
        // CREAR LIBRO
        // ======================================

        const libro =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            libro,
            hoja,
            "Preguntas y Respuestas"
        );


        // ======================================
        // NOMBRE DEL ARCHIVO
        // ======================================

        const fechaArchivo =
            ahora
                .toISOString()
                .slice(
                    0,
                    10
                );


        XLSX.writeFile(

            libro,

            "BANCO_PREGUNTAS_RESPUESTAS_"
            + fechaArchivo
            + ".xlsx"

        );


    } catch (error) {

        console.error(
            "Error al exportar:",
            error
        );


        alert(
            "No se pudo generar el archivo Excel.\n\n"
            + error.message
        );

    }

}

async function eliminarPregunta(id) {

    const confirmar =
        confirm(
            "¿Está seguro de eliminar esta pregunta?\n\n" +
            "Esta acción no se puede deshacer."
        );


    if (!confirmar) {

        return;

    }


    try {

        await deleteDoc(
            doc(
                db,
                "preguntas",
                id
            )
        );


        alert(
            "Pregunta eliminada correctamente."
        );


        // Recargar preguntas

        await cargarPreguntas();


    } catch (error) {

        console.error(
            "Error al eliminar:",
            error
        );


        alert(
            "No se pudo eliminar la pregunta.\n\n" +
            error.message
        );

    }

}
</script>
