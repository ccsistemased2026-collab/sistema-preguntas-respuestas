    <style>

        @media (max-width: 700px) {

<body>


<div class="contenedor">


    <!-- =====================================
         ENCABEZADO

    <div class="encabezado">


        <h1>
            PREGUNTAS
        </h1>


        <div class="acciones">


            <a
                href="nueva-pregunta.html"

            <button
                type="button"

    <!-- =====================================

    <!-- =====================================

    <div

        </span>

    <!-- =====================================

    ====================================== -->

    <div class="filtros">


        <input
            type="text"
            id="buscador"
            class="buscador"
            placeholder="🔎 Buscar pregunta, área o usuario...">


        <select id="filtroEstado">


            <option value="TODOS">
                Todos los estados
            </option>

                Pendiente
            </option>


            <option value="RESPONDIDA">
                Respondida
            </option>


        </select>


    </div>


    <!-- =====================================
         TABLA
    ====================================== -->

    <div class="tabla-contenedor">


        <table>


            <thead>


                <tr>


                    <th>
                        N°
                    </th>


                    <th>
                        PREGUNTA
                    </th>


                    <th>
                        ÁREA
                    </th>


                    <th>
                        USUARIO
                    </th>


                    <th>
                        FECHA
                    </th>


                    <th>
                        ESTADO
                    </th>
                    
                    <th>
                        ARCHIVO
                    </th>
                    
                    <th>
                        ACCIONES
                    </th>


                </tr>


            </thead>


            <tbody id="tablaPreguntas">


                <tr>


                    <td
                        colspan="8"
                        class="mensaje cargando">

                        Cargando información...

                    </td>


                </tr>


            </tbody>


        </table>


    </div>


</div>


<script type="module">


    // =====================================================
    // FIREBASE
    // =====================================================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy,
        deleteDoc,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // CONFIGURACIÓN FIREBASE
    // =====================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",

        authDomain:
            "sistema-preguntas-respuestas.firebaseapp.com",

        projectId:
            "sistema-preguntas-respuestas",

        storageBucket:
            "sistema-preguntas-respuestas.firebasestorage.app",

        messagingSenderId:
            "606737336904",

        appId:
            "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    // =====================================================
    // INICIALIZAR FIREBASE
    // =====================================================

    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    // =====================================================
    // VARIABLES
    // =====================================================

    let todasLasPreguntas = [];

    let usuarioActualRol = "";


    // =====================================================
    // OBTENER ROL DEL USUARIO
    // =====================================================

    async function obtenerRolUsuario(user) {

        try {

            const usuarioRef =
                doc(
                    db,
                    "usuarios",
                    user.uid
                );


            const usuarioSnapshot =
                await getDoc(
                    usuarioRef
                );


            if (
                !usuarioSnapshot.exists()
            ) {

                console.error(
                    "No existe el perfil del usuario."
                );

                return "";

            }


            const datosUsuario =
                usuarioSnapshot.data();


            return (
                datosUsuario.rol
                || ""
            );


        } catch (error) {

            console.error(
                "Error obteniendo rol:",
                error
            );

            return "";

        }

    }


    // =====================================================
    // OBTENER ÁREA
    // =====================================================
    //
    // Preguntas nuevas:
    //     datos.area
    //
    // Preguntas antiguas:
    //     datos.categoria
    //
    // De esta manera no perdemos los registros anteriores.
    // =====================================================

    function obtenerArea(datos) {

        return (
            datos.area
            ||
            datos.categoria
            ||
            ""
        );

    }


    // =====================================================
    // CARGAR PREGUNTAS
    // =====================================================

    async function cargarPreguntas() {


        const tabla =
            document.getElementById(
                "tablaPreguntas"
            );


        tabla.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="mensaje cargando">

                    Cargando información...

                </td>

            </tr>

        `;


        try {


            const consulta =
                query(

                    collection(
                        db,
                        "preguntas"
                    ),

                    orderBy(
                        "fecha",
                        "desc"
                    )

                );


            const resultado =
                await getDocs(
                    consulta
                );


            todasLasPreguntas = [];


            resultado.forEach(
                (documento) => {


                    const datos =
                        documento.data();


                    todasLasPreguntas.push({
                    
                        id:
                            documento.id,
                    
                        pregunta:
                            datos.pregunta || "",
                    
                        area:
                            obtenerArea(datos),
                    
                        usuarioCorreo:
                            datos.usuarioCorreo || "",
                    
                        estado:
                            datos.estado || "PENDIENTE",
                    
                        fecha:
                            datos.fecha || null,
                    
                        archivoUrl:
                            datos.archivoUrl || "",
                    
                        archivoNombre:
                            datos.archivoNombre || "",
                    
                        archivoTipo:
                            datos.archivoTipo || ""
                    
                    });


                }
            );


            mostrarPreguntas(
                todasLasPreguntas
            );


            actualizarContadorPendientes();


        } catch (error) {


            console.error(
                "Error cargando preguntas:",
                error
            );


            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="mensaje error">

                        <strong>
                            No se pudo cargar la información.
                        </strong>

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;

        }

    }


    // =====================================================
    // MOSTRAR PREGUNTAS
    // =====================================================

    function mostrarPreguntas(
        preguntas
    ) {


        const tabla =
            document.getElementById(
                "tablaPreguntas"
            );


        if (
            preguntas.length === 0
        ) {


            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="mensaje">

                        No existen preguntas.

                    </td>

                </tr>

            `;


            return;

        }


        tabla.innerHTML = "";


        preguntas.forEach(
            (pregunta, indice) => {


                let fecha =
                    "";


                if (
                    pregunta.fecha
                    &&
                    typeof pregunta.fecha.toDate ===
                        "function"
                ) {

                    fecha =
                        pregunta.fecha
                            .toDate()
                            .toLocaleString(
                                "es-PE"
                            );

                }


                let claseEstado =
                    "estado-pendiente";


                if (
                    pregunta.estado ===
                    "RESPONDIDA"
                ) {

                    claseEstado =
                        "estado-respondida";

                }


                // =========================================
                // BOTÓN ELIMINAR
                // SOLO ADMINISTRADOR
                // =========================================

                let botonEliminar =
                    "";


                if (
                    usuarioActualRol ===
                    "ADMINISTRADOR"
                ) {


                    botonEliminar = `

                        <button
                            type="button"
                            class="btn-eliminar"
                            data-id="${escapeHTML(
                                pregunta.id
                            )}">

                            🗑️ Eliminar

                        </button>

                    `;

                }
                let botonArchivo = "";

                    if (pregunta.archivoUrl) {
                    
                        botonArchivo = `
                            <a
                                href="${escapeHTML(pregunta.archivoUrl)}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="boton btn-ver">
                    
                                📎 Ver archivo
                    
                            </a>
                        `;
                    
                    } else {
                    
                        botonArchivo = "—";
                    
                    }

                const fila =
                    document.createElement(
                        "tr"
                    );


                fila.innerHTML = `

                    <td>
                        ${indice + 1}
                    </td>


                    <td>

                        ${escapeHTML(
                            pregunta.pregunta
                        )}

                    </td>


                    <td>

                        ${escapeHTML(
                            pregunta.area
                        )}

                    </td>


                    <td>

                        ${escapeHTML(
                            pregunta.usuarioCorreo
                        )}

                    </td>


                    <td>

                        ${escapeHTML(
                            fecha
                        )}

                    </td>


                    <td>
                    
                        <span
                            class="estado ${claseEstado}">
                    
                            ${escapeHTML(
                                pregunta.estado
                            )}
                    
                        </span>
                    
                    </td>
                    
                    
                    <td>
                    
                        ${botonArchivo}
                    
                    </td>
                    
                    
                    <td>
                    
                        <a
                            href="detalle-pregunta.html?id=${encodeURIComponent(
                                pregunta.id
                            )}"
                            class="boton btn-ver">
                    
                            Ver
                    
                        </a>
                    
                        ${botonEliminar}
                    
                    </td>

                `;


                tabla.appendChild(
                    fila
                );

            }
        );


        // ================================================
        // EVENTOS DE ELIMINACIÓN
        // ================================================

        document
            .querySelectorAll(
                ".btn-eliminar"
            )
            .forEach(
                (boton) => {


                    boton.addEventListener(
                        "click",
                        () => {

                            eliminarPregunta(
                                boton.dataset.id
                            );

                        }
                    );


                }
            );

    }


    // =====================================================
    // ESCAPAR HTML
    // =====================================================

    function escapeHTML(
        texto
    ) {


        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            texto
            ?? "";


        return div.innerHTML;

    }


    // =====================================================
    // BUSCAR Y FILTRAR
    // =====================================================

    function aplicarFiltros() {


        const texto =
            document
                .getElementById(
                    "buscador"
                )
                .value
                .toLowerCase()
                .trim();


        const estado =
            document
                .getElementById(
                    "filtroEstado"
                )
                .value;


        const filtradas =
            todasLasPreguntas.filter(
                (pregunta) => {


                    const coincideTexto =

                        pregunta.pregunta
                            .toLowerCase()
                            .includes(
                                texto
                            )

                        ||

                        pregunta.area
                            .toLowerCase()
                            .includes(
                                texto
                            )

                        ||

                        pregunta.usuarioCorreo
                            .toLowerCase()
                            .includes(
                                texto
                            );


                    const coincideEstado =

                        estado ===
                        "TODOS"

                        ||

                        pregunta.estado ===
                        estado;


                    return (

                        coincideTexto
                        &&
                        coincideEstado

                    );

                }
            );


        mostrarPreguntas(
            filtradas
        );

    }


    // =====================================================
    // CONTADOR DE PENDIENTES
    // =====================================================

    function actualizarContadorPendientes() {


        const cantidad =
            todasLasPreguntas.filter(
                (pregunta) =>
                    pregunta.estado ===
                    "PENDIENTE"
            ).length;


        const contenedor =
            document.getElementById(
                "notificacionPendientes"
            );


        const contador =
            document.getElementById(
                "contadorPendientes"
            );


        if (

            usuarioActualRol ===
            "ADMINISTRADOR"

            ||

            usuarioActualRol ===
            "RESPONDEDOR"

        ) {


            contador.textContent =
                cantidad;


            contenedor.style.display =
                "block";


        } else {


            contenedor.style.display =
                "none";

        }

    }


    // =====================================================
    // ELIMINAR PREGUNTA
    // =====================================================

    async function eliminarPregunta(
        id
    ) {


        // Verificación adicional

        if (
            usuarioActualRol !==
            "ADMINISTRADOR"
        ) {


            alert(
                "No tiene permisos para eliminar preguntas."
            );


            return;

        }


        const confirmar =
            confirm(

                "¿Está seguro de eliminar esta pregunta?\n\n"
                +
                "Esta acción no se puede deshacer."

            );


        if (!confirmar) {

            return;

        }


        try {


            await deleteDoc(

                doc(
                    db,
                    "preguntas",
                    id
                )

            );


            alert(
                "Pregunta eliminada correctamente."
            );


            await cargarPreguntas();


        } catch (error) {


            console.error(
                "Error eliminando pregunta:",
                error
            );


            alert(

                "No se pudo eliminar la pregunta.\n\n"
                +
                error.message

            );

        }

    }


    // =====================================================
    // EXPORTAR EXCEL
    // =====================================================

    async function exportarExcel() {


        try {


            if (
                todasLasPreguntas.length === 0
            ) {


                alert(
                    "No existen preguntas para exportar."
                );


                return;

            }


            // =============================================
            // FILTROS ACTUALES
            // =============================================

            const texto =
                document
                    .getElementById(
                        "buscador"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const estadoSeleccionado =
                document
                    .getElementById(
                        "filtroEstado"
                    )
                    .value;


            const preguntasFiltradas =
                todasLasPreguntas.filter(
                    (pregunta) => {


                        const coincideTexto =

                            pregunta.pregunta
                                .toLowerCase()
                                .includes(
                                    texto
                                )

                            ||

                            pregunta.area
                                .toLowerCase()
                                .includes(
                                    texto
                                )

                            ||

                            pregunta.usuarioCorreo
                                .toLowerCase()
                                .includes(
                                    texto
                                );


                        const coincideEstado =

                            estadoSeleccionado ===
                            "TODOS"

                            ||

                            pregunta.estado ===
                            estadoSeleccionado;


                        return (

                            coincideTexto
                            &&
                            coincideEstado

                        );

                    }
                );


            if (
                preguntasFiltradas.length === 0
            ) {


                alert(
                    "No existen registros para exportar."
                );


                return;

            }


            // =============================================
            // OBTENER RESPUESTAS
            // =============================================

            const respuestasSnapshot =
                await getDocs(

                    collection(
                        db,
                        "respuestas"
                    )

                );


            const respuestas = {};


            respuestasSnapshot.forEach(
                (documento) => {


                    const datos =
                        documento.data();


                    if (
                        datos.preguntaId
                    ) {


                        respuestas[
                            datos.preguntaId
                        ] = datos;

                    }

                }
            );


            // =============================================
            // FECHA
            // =============================================

            const ahora =
                new Date();


            const fechaGeneracion =
                ahora.toLocaleString(
                    "es-PE"
                );


            // =============================================
            // INFORMACIÓN EXCEL
            // =============================================

            const datosExcel = [

                [
                    "BANCO DE PREGUNTAS Y RESPUESTAS"
                ],

                [
                    "Fecha de generación",
                    fechaGeneracion
                ],

                [
                    "Estado filtrado",
                    estadoSeleccionado
                ],

                [
                    "Texto buscado",
                    texto || "-"
                ],

                [
                    "Total de registros",
                    preguntasFiltradas.length
                ],

                [],

                [

                    "N°",

                    "ID",

                    "PREGUNTA",

                    "ÁREA",

                    "USUARIO",

                    "FECHA PREGUNTA",

                    "ESTADO",

                    "RESPUESTA",

                    "RESPONDIDO POR",

                    "FECHA RESPUESTA"

                ]

            ];


            // =============================================
            // FILAS
            // =============================================

            preguntasFiltradas.forEach(
                (pregunta, indice) => {


                    let fechaPregunta =
                        "";


                    if (
                        pregunta.fecha
                        &&
                        typeof pregunta.fecha.toDate ===
                            "function"
                    ) {


                        fechaPregunta =
                            pregunta.fecha
                                .toDate()
                                .toLocaleString(
                                    "es-PE"
                                );

                    }


                    const respuesta =
                        respuestas[
                            pregunta.id
                        ];


                    let textoRespuesta =
                        "";


                    let respondidoPor =
                        "";


                    let fechaRespuesta =
                        "";


                    if (
                        respuesta
                    ) {


                        textoRespuesta =
                            respuesta.respuesta
                            || "";


                        respondidoPor =
                            respuesta.usuarioCorreo
                            || "";


                        if (
                            respuesta.fecha
                            &&
                            typeof respuesta.fecha.toDate ===
                                "function"
                        ) {


                            fechaRespuesta =
                                respuesta.fecha
                                    .toDate()
                                    .toLocaleString(
                                        "es-PE"
                                    );

                        }

                    }


                    datosExcel.push([

                        indice + 1,

                        pregunta.id,

                        pregunta.pregunta,

                        pregunta.area,

                        pregunta.usuarioCorreo,

                        fechaPregunta,

                        pregunta.estado,

                        textoRespuesta,

                        respondidoPor,

                        fechaRespuesta

                    ]);

                }
            );


            // =============================================
            // CREAR HOJA
            // =============================================

            const hoja =
                XLSX.utils.aoa_to_sheet(
                    datosExcel
                );


            hoja["!cols"] = [

                { wch: 6 },

                { wch: 20 },

                { wch: 60 },

                { wch: 22 },

                { wch: 30 },

                { wch: 22 },

                { wch: 15 },

                { wch: 70 },

                { wch: 30 },

                { wch: 22 }

            ];


            // =============================================
            // CREAR LIBRO
            // =============================================

            const libro =
                XLSX.utils.book_new();


            XLSX.utils.book_append_sheet(

                libro,

                hoja,

                "Preguntas y Respuestas"

            );


            // =============================================
            // DESCARGAR
            // =============================================

            const fechaArchivo =
                ahora
                    .toISOString()
                    .slice(
                        0,
                        10
                    );


            XLSX.writeFile(

                libro,

                `BANCO_PREGUNTAS_RESPUESTAS_${fechaArchivo}.xlsx`

            );


        } catch (error) {


            console.error(
                "Error exportando Excel:",
                error
            );


            alert(

                "No se pudo generar el archivo Excel.\n\n"
                +
                error.message

            );

        }

    }


    // =====================================================
    // EVENTOS
    // =====================================================

    document
        .getElementById(
            "buscador"
        )
        .addEventListener(
            "input",
            aplicarFiltros
        );


    document
        .getElementById(
            "filtroEstado"
        )
        .addEventListener(
            "change",
            aplicarFiltros
        );


    document
        .getElementById(
            "btnExcel"
        )
        .addEventListener(
            "click",
            exportarExcel
        );


    // =====================================================
    // AUTENTICACIÓN
    // =====================================================

    onAuthStateChanged(

        auth,

        async (user) => {


            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            try {


                usuarioActualRol =
                    await obtenerRolUsuario(
                        user
                    );


                console.log(
                    "Usuario:",
                    user.email
                );


                console.log(
                    "Rol:",
                    usuarioActualRol
                );


                await cargarPreguntas();


            } catch (error) {


                console.error(
                    "Error inicializando:",
                    error
                );


                document
                    .getElementById(
                        "tablaPreguntas"
                    )
                    .innerHTML = `

                        <tr>

                            <td
                                colspan="7"
                                class="mensaje error">

                                Error al iniciar la página.

                                <br><br>

                                ${escapeHTML(
                                    error.message
                                )}

                            </td>

                        </tr>

                    `;

            }

        }

    );


</script>


</body>
