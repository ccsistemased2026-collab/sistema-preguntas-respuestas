<script type="module">


    // =====================================================
    // FIREBASE
    // =====================================================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy,
        deleteDoc,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // CONFIGURACIÓN FIREBASE
    // =====================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",

        authDomain:
            "sistema-preguntas-respuestas.firebaseapp.com",

        projectId:
            "sistema-preguntas-respuestas",

        storageBucket:
            "sistema-preguntas-respuestas.firebasestorage.app",

        messagingSenderId:
            "606737336904",

        appId:
            "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    // =====================================================
    // INICIALIZAR FIREBASE
    // =====================================================

    const app =
        initializeApp(
            firebaseConfig
        );


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    // =====================================================
    // VARIABLES
    // =====================================================

        let todasLasPreguntas = [];
        
        let usuarios = {};
        
        let usuarioActualRol = "";


    // =====================================================
    // OBTENER ROL DEL USUARIO
    // =====================================================

    async function obtenerRolUsuario(user) {

        try {

            const usuarioRef =
                doc(
                    db,
                    "usuarios",
                    user.uid
                );


            const usuarioSnapshot =
                await getDoc(
                    usuarioRef
                );


            if (
                !usuarioSnapshot.exists()
            ) {

                console.error(
                    "No existe el perfil del usuario."
                );

                return "";

            }


            const datosUsuario =
                usuarioSnapshot.data();


            return (
                datosUsuario.rol
                || ""
            );


        } catch (error) {

            console.error(
                "Error obteniendo rol:",
                error
            );

            return "";

        }

    }


    // =====================================================
    // OBTENER ÁREA
    // =====================================================
    //
    // Preguntas nuevas:
    //     datos.area
    //
    // Preguntas antiguas:
    //     datos.categoria
    //
    // De esta manera no perdemos los registros anteriores.
    // =====================================================

    function obtenerArea(datos) {

        return (
            datos.area
            ||
            datos.categoria
            ||
            ""
        );

    }

    // =====================================================
    // CARGAR USUARIOS
    // =====================================================
    
            async function cargarUsuarios() {
            
                try {
            
                    const resultado =
                        await getDocs(
                            collection(
                                db,
                                "usuarios"
                            )
                        );
            
                    usuarios = {};
            
                    resultado.forEach(
                        (documento) => {
            
                            const datos =
                                documento.data();
            
                            usuarios[documento.id] = {
            
                                nombre:
                                    datos.nombre || "",
            
                                correo:
                                    datos.correo ||
                                    datos.email ||
                                    "",
            
                                cargo:
                                    datos.cargo || "",
            
                                sedeOperativa:
                                    datos.sedeOperativa || ""
            
                            };
            
                        }
                    );
            
                    console.log(
                        "Índice de usuarios:",
                        usuarios
                    );
            
                } catch (error) {
            
                    console.error(
                        "Error cargando usuarios:",
                        error
                    );
            
                    throw error;
            
                }
            
            }

    // =====================================================
    // CARGAR PREGUNTAS
    // =====================================================

    async function cargarPreguntas() {


        const tabla =
            document.getElementById(
                "tablaPreguntas"
            );


        tabla.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="mensaje cargando">

                    Cargando información...

                </td>

            </tr>

        `;


        try {


            const consulta =
                query(

                    collection(
                        db,
                        "preguntas"
                    ),

                    orderBy(
                        "fecha",
                        "desc"
                    )

                );


            const resultado =
                await getDocs(
                    consulta
                );


            todasLasPreguntas = [];


                resultado.forEach(
                    (documento) => {
                
                        const datos =
                            documento.data();
                
                
                        const usuario =
                            usuarios[datos.usuarioId] || {};
                
                
                        console.log(
                            "RELACIÓN PREGUNTA → USUARIO",
                            {
                                preguntaId: documento.id,
                                usuarioId: datos.usuarioId,
                                usuarioEncontrado: usuario
                            }
                        );
                    
                    console.log(
                        "Pregunta:",
                        documento.id,
                        "usuarioId:",
                        datos.usuarioId,
                        "usuario encontrado:",
                        usuario
                    );
                    
                    todasLasPreguntas.push({
                    
                        id:
                            documento.id,
                    
                        pregunta:
                            datos.pregunta || "",
                    
                        area:
                            obtenerArea(datos),
                    
                        usuarioCorreo:
                            datos.usuarioCorreo || "",

                        usuarioId:
                        datos.usuarioId || "",
                    
                        usuarioNombre:
                            usuario.nombre || "",
                    
                        cargo:
                            usuario.cargo || "No registrado",
                    
                        sedeOperativa:
                            usuario.sedeOperativa || "No registrada",
                    
                        estado:
                            datos.estado || "PENDIENTE",
                    
                        fecha:
                            datos.fecha || null,
                    
                        archivoUrl:
                            datos.archivoUrl || "",
                    
                        archivoNombre:
                            datos.archivoNombre || "",
                    
                        archivoTipo:
                            datos.archivoTipo || ""


                    
                    });


                }
            );


            mostrarPreguntas(
                todasLasPreguntas
            );


            actualizarContadorPendientes();


        } catch (error) {


            console.error(
                "Error cargando preguntas:",
                error
            );


            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="mensaje error">

                        <strong>
                            No se pudo cargar la información.
                        </strong>

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </td>

                </tr>

            `;

        }

    }


    // =====================================================
    // MOSTRAR PREGUNTAS
    // =====================================================

    function mostrarPreguntas(
        preguntas
    ) {


        const tabla =
            document.getElementById(
                "tablaPreguntas"
            );


        if (
            preguntas.length === 0
        ) {


            tabla.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="mensaje">

                        No existen preguntas.

                    </td>

                </tr>

            `;


            return;

        }


        tabla.innerHTML = "";


        preguntas.forEach(
            (pregunta, indice) => {


                let fecha =
                    "";


                if (
                    pregunta.fecha
                    &&
                    typeof pregunta.fecha.toDate ===
                        "function"
                ) {

                    fecha =
                        pregunta.fecha
                            .toDate()
                            .toLocaleString(
                                "es-PE"
                            );

                }


                let claseEstado =
                    "estado-pendiente";


                if (
                    pregunta.estado ===
                    "RESPONDIDA"
                ) {

                    claseEstado =
                        "estado-respondida";

                }


                // =========================================
                // BOTÓN ELIMINAR
                // SOLO ADMINISTRADOR
                // =========================================

                let botonEliminar =
                    "";


                if (
                    usuarioActualRol ===
                    "ADMINISTRADOR"
                ) {


                    botonEliminar = `

                        <button
                            type="button"
                            class="btn-eliminar"
                            data-id="${escapeHTML(
                                pregunta.id
                            )}">

                            🗑️ Eliminar

                        </button>

                    `;

                }
                let botonArchivo = "";

                    if (pregunta.archivoUrl) {
                    
                        botonArchivo = `
                            <a
                                href="${escapeHTML(pregunta.archivoUrl)}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="boton btn-archivo">
                    
                                📎 Ver archivo
                    
                            </a>
                        `;
                    
                    } else {
                    
                        botonArchivo = "—";
                    
                    }

                const fila =
                    document.createElement(
                        "tr"
                    );


                fila.innerHTML = `

                    <td>
                        ${indice + 1}
                    </td>


                    <td>

                        ${escapeHTML(
                            pregunta.pregunta
                        )}

                    </td>


                    <td>

                        ${escapeHTML(
                            pregunta.area
                        )}

                    </td>


                    <td>

                        ${escapeHTML(
                            pregunta.usuarioCorreo
                        )}

                    </td>

                    <td>
                        ${escapeHTML(
                            pregunta.cargo
                        )}
                    </td>
                    
                    <td>
                        ${escapeHTML(
                            pregunta.sedeOperativa
                        )}
                    </td>


                    <td>

                        ${escapeHTML(
                            fecha
                        )}

                    </td>


                    <td>
                    
                        <span
                            class="estado ${claseEstado}">
                    
                            ${escapeHTML(
                                pregunta.estado
                            )}
                    
                        </span>
                    
                    </td>
                    
                    
                    <td>
                    
                        ${botonArchivo}
                    
                    </td>
                    
                    
                    <td>
                    
                        <a
                            href="detalle-pregunta.html?id=${encodeURIComponent(
                                pregunta.id
                            )}"
                            class="boton btn-ver">
                    
                            Ver
                    
                        </a>
                    
                        ${botonEliminar}
                    
                    </td>

        // ================================================

        // ================================================

        document

                    );

    function escapeHTML(
        texto
    ) {


        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            texto
            ?? "";


        return div.innerHTML;

    }


    // =====================================================
    // BUSCAR Y FILTRAR
    // =====================================================

            function aplicarFiltros() {
        
            const texto =
                document
                    .getElementById("buscador")
                    .value
                    .toLowerCase()
                    .trim();
        
        
            const area =
                document
                    .getElementById("filtroArea")
                    .value;
        
        
            const sede =
                document
                    .getElementById("filtroSede")
                    .value;
        
        
            const estado =
                document
                    .getElementById("filtroEstado")
                    .value;
        
        
            const filtradas =
                todasLasPreguntas.filter(
                    (pregunta) => {
        
        
                        // =========================================
                        // BUSCADOR
                        // =========================================
        
                        const coincideTexto =
        
                            pregunta.pregunta
                                .toLowerCase()
                                .includes(texto)
        
                            ||
        
                            pregunta.area
                                .toLowerCase()
                                .includes(texto)
        
                            ||
        
                            pregunta.usuarioCorreo
                                .toLowerCase()
                                .includes(texto)
        
                            ||
        
                            pregunta.cargo
                                .toLowerCase()
                                .includes(texto)
        
                            ||
        
                            pregunta.sedeOperativa
                                .toLowerCase()
                                .includes(texto);
        
        
                        // =========================================
                        // ÁREA
                        // =========================================
        
                        const coincideArea =
        
                            area === "TODOS"
        
                            ||
        
                            pregunta.area === area;
        
        
                        // =========================================
                        // SEDE
                        // =========================================
        
                        const coincideSede =
        
                            sede === "TODOS"
        
                            ||
        
                            pregunta.sedeOperativa === sede;
        
        
                        // =========================================
                        // ESTADO
                        // =========================================
        
                        const coincideEstado =
        
                            estado === "TODOS"
        
                            ||
        
                            pregunta.estado === estado;
        
        
                        // =========================================
                        // RESULTADO
                        // =========================================
        
                        return (
        
                            coincideTexto
        
                            &&
        
                            coincideArea
        
                            &&
        
                            coincideSede
        
                            &&
        
                            coincideEstado
        
                        );
        
                    }
                );
        
        
            mostrarPreguntas(
                filtradas
            );
        
        }

    function actualizarContadorPendientes() {


        const cantidad =
            todasLasPreguntas.filter(
                (pregunta) =>
                    pregunta.estado ===
                    "PENDIENTE"
            ).length;


        const contenedor =
            document.getElementById(
                "notificacionPendientes"
            );


        const contador =
            document.getElementById(
                "contadorPendientes"
            );


        if (

            usuarioActualRol ===
            "ADMINISTRADOR"

            ||

            usuarioActualRol ===
            "RESPONDEDOR"

        ) {


            contador.textContent =
                cantidad;


            contenedor.style.display =
                "block";


        } else {


            contenedor.style.display =
                "none";

        }

    }


    // =====================================================
    // ELIMINAR PREGUNTA
    // =====================================================

    async function eliminarPregunta(
        id
    ) {


        // Verificación adicional

        if (
            usuarioActualRol !==
            "ADMINISTRADOR"
        ) {


            alert(
                "No tiene permisos para eliminar preguntas."
            );


            return;

        }


        const confirmar =
            confirm(

                "¿Está seguro de eliminar esta pregunta?\n\n"
                +
                "Esta acción no se puede deshacer."

            );


        if (!confirmar) {

            return;

        }


        try {


            await deleteDoc(

                doc(
                    db,
                    "preguntas",
                    id
                )

            );


            alert(
                "Pregunta eliminada correctamente."
            );


            await cargarPreguntas();


        } catch (error) {


            console.error(
                "Error eliminando pregunta:",
                error
            );


            alert(

                "No se pudo eliminar la pregunta.\n\n"
                +
                error.message

            );

        }

    }

                document
                    .getElementById("filtroEstado")
                    .value;
    
    
            // =================================================
            // APLICAR FILTROS
            // =================================================

                todasLasPreguntas.filter((pregunta) => {
    
                    const coincideTexto =
    
                        pregunta.pregunta
                            .toLowerCase()
                            .includes(texto)

                        pregunta.area
                            .toLowerCase()
                            .includes(texto)
    
                        ||
    
                        pregunta.usuarioCorreo
                            .toLowerCase()
                            .includes(texto);
    
    
                    const coincideEstado =
    
                        estadoSeleccionado === "TODOS"
    
                        ||
    
                        pregunta.estado === estadoSeleccionado;
    
    
                    return (
                        coincideTexto &&
                        coincideEstado
                    );

            if (preguntasFiltradas.length === 0) {

                    "No existen registros para exportar."
                );

            // =================================================
            // OBTENER RESPUESTAS
            // =================================================
    
            const respuestasSnapshot =
                await getDocs(
                    collection(
                        db,
                        "respuestas"
                    )
                );
    
    
            const respuestas = {};
    
    
            respuestasSnapshot.forEach(
                (documento) => {
    
                    const datos =
                        documento.data();

                            datos.preguntaId

            // =================================================

            // =================================================

                // FILA 2

                    "NOMBRE CONSULTADOR",
                    "FECHA",
                    "RESPUESTA",
                    "CARGO",
                    "NOMBRE RESPONDEDOR"
                ]
    
            ];
    
    
            // =================================================
            // REGISTROS
            // =================================================
    
            preguntasFiltradas.forEach(
                (pregunta) => {
    
    
                    // -----------------------------------------
                    // FECHA DE LA CONSULTA
                    // -----------------------------------------
    
                    let fechaPregunta = "";
    
    
                    if (
                        pregunta.fecha &&
                        typeof pregunta.fecha.toDate ===
                        "function"
                    ) {
    
                        fechaPregunta =
                            pregunta.fecha
                                .toDate()

                                    "es-PE"

                    }
    
    
                    // -----------------------------------------
                    // RESPUESTA
                    // -----------------------------------------
    
                    const respuesta =
                        respuestas[
                            pregunta.id
                        ];
    
    
                    let fechaRespuesta = "";
    
                    let textoRespuesta = "";
    
                    let cargoRespondedor = "";
    
                    let nombreRespondedor = "";
    
    
                    if (respuesta) {
    
    
                        textoRespuesta =
                            respuesta.respuesta
                            || "";

                            respuesta.fecha &&
                            typeof respuesta.fecha.toDate ===
                            "function"
                        ) {

                            || "";
    
    
                        // Nombre del respondedor
                        nombreRespondedor =
                            respuesta.nombre
                            || respuesta.nombreRespondedor
                            || "";
    
                    }
    
    
                    // -----------------------------------------
                    // DATOS DEL CONSULTADOR
                    // -----------------------------------------
    
                    const sedeOperativa =
                        pregunta.sedeOperativa
                        || "";
    
    
                    const nombreConsultador =
                        pregunta.nombreConsultador
                        || pregunta.usuarioNombre
                        || "";
    
    
                    // -----------------------------------------
                    // EVIDENCIA
                    // -----------------------------------------

                        pregunta.archivoUrl

                        evidencia =
                            pregunta.archivoNombre
                            || "Ver archivo";
    
                    }
    
    
                    // -----------------------------------------
                    // AGREGAR FILA
                    // -----------------------------------------
    
                    datosExcel.push([
    
                        fechaPregunta,
    
                        sedeOperativa,
    
                        pregunta.pregunta

            // =================================================
            // INFORMACIÓN DE IMPORTACIÓN
            // =================================================

        } catch (error) {
    
            console.error(
