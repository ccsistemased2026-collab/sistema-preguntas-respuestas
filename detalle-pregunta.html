<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Detalle de pregunta</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 20px 30px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .titulo {
            font-weight: bold;
            color: #555;
            margin-top: 15px;
        }

        .pregunta {
            font-size: 20px;
            margin-top: 8px;
            line-height: 1.6;
        }

        .estado {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 12px;
            border-radius: 5px;
            font-weight: bold;
        }

        .pendiente {
            background: #fff3cd;
            color: #856404;
        }

        .respondida {
            background: #d1e7dd;
            color: #0f5132;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

            button,
            .volver,
            .btn-archivo {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            
                margin-top: 15px;
            
                padding: 7px 12px;
            
                border: none;
            
                border-radius: 5px;
            
                background: #1f4e78;
            
                color: white;
            
                cursor: pointer;
            
                text-decoration: none;
            
                font-size: 13px;
            
                line-height: 1.2;
            }
            
            button:hover,
            .volver:hover,
            .btn-archivo:hover {
                opacity: 0.9;
            }
            
            .btn-volver {
                background: #6c757d;
            }
            
            .btn-responder {
                background: #1f4e78;
            }
            
            .btn-archivo {
                background: #5c6f82;
            }

        #contenido {
            display: none;
        }

        #error {
            display: none;
            background: #f8d7da;
            color: #842029;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .archivo-imagen {
            display: block;
        
            max-width: 100%;
        
            max-height: 450px;
        
            margin-top: 12px;
        
            border: 1px solid #ddd;
        
            border-radius: 6px;
        }

    </style>

</head>


<body>

<header>

    <h2>Detalle de pregunta</h2>

</header>


<main class="container">

    <div id="cargando" class="card">

        Cargando información...

    </div>


    <div id="error"></div>


    <div id="contenido">

        <!-- PREGUNTA -->

        <div class="card">

            <div class="titulo">
                Pregunta
            </div>

            <div
                id="pregunta"
                class="pregunta">
            </div>


            <div class="titulo">
                Área
            </div>

            <div id="categoria">
            </div>


            <div class="titulo">
                Estado
            </div>

            <span
                id="estado"
                class="estado">
            </span>


            <div class="titulo">
                Usuario
            </div>

            <div id="usuario">
            </div>


            <div class="titulo">
                Fecha
            </div>

            <div id="fecha">
            </div>

            <div
                id="contenedorArchivo"
                style="display:none;">
            
                <div class="titulo">
                    Archivo adjunto
                </div>
            
                <div id="archivo">
                </div>
            
            </div>
        </div>


        <!-- RESPUESTA -->

        <div class="card">

            <div class="titulo">
                Respuesta
            </div>

            <div id="respuesta">

                Aún no existe una respuesta.

            </div>

        </div>


        <!-- FORMULARIO -->

        <div
            id="formularioRespuesta"
            class="card"
            style="display:none;">

            <div class="titulo">
                Registrar respuesta
            </div>

            <br>

            <textarea
                id="textoRespuesta"
                placeholder="Escriba la respuesta...">
            </textarea>

            <br>

            <button
                id="btnResponder"
                class="btn-responder">
            
                REGISTRAR RESPUESTA
            
            </button>

        </div>


        <a
            href="preguntas.html"
            class="volver btn-volver">
        
            ← Volver a preguntas
        
        </a>

    </div>

</main>


<script type="module">

    // =========================================
    // FIREBASE
    // =========================================

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        collection,
        query,
        where,
        getDocs,
        addDoc,
        updateDoc,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =========================================
    // CONFIGURACIÓN
    // =========================================

    const firebaseConfig = {

          apiKey: "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",
          authDomain: "sistema-preguntas-respuestas.firebaseapp.com",
          projectId: "sistema-preguntas-respuestas",
          storageBucket: "sistema-preguntas-respuestas.firebasestorage.app",
          messagingSenderId: "606737336904",
          appId: "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    // =========================================
    // INICIALIZAR FIREBASE
    // =========================================

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    // =========================================
    // ELEMENTOS
    // =========================================

    const cargando =
        document.getElementById("cargando");

    const contenido =
        document.getElementById("contenido");

    const error =
        document.getElementById("error");


    // =========================================
    // MOSTRAR ERROR
    // =========================================

    function mostrarError(mensaje) {

        cargando.style.display = "none";

        error.textContent =
            mensaje;

        error.style.display =
            "block";

        console.error(mensaje);

    }


    // =========================================
    // OBTENER ID
    // =========================================

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    const preguntaId =
        parametros.get("id");


    console.log(
        "ID de pregunta:",
        preguntaId
    );


    if (!preguntaId) {

        mostrarError(
            "No se encontró el ID de la pregunta en la URL."
        );

    }


    // =========================================
    // SESIÓN
    // =========================================

    onAuthStateChanged(
        auth,
        async function(user) {

            console.log(
                "Usuario:",
                user
            );


            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            try {

                // =================================
                // PERFIL
                // =================================

                const usuarioRef =
                    doc(
                        db,
                        "usuarios",
                        user.uid
                    );


                const usuarioSnapshot =
                    await getDoc(
                        usuarioRef
                    );


                if (!usuarioSnapshot.exists()) {

                    mostrarError(
                        "No existe el documento del usuario en Firestore."
                    );

                    return;

                }


                const usuario =
                    usuarioSnapshot.data();


                console.log(
                    "ROL:",
                    usuario.rol
                );


                // =================================
                // PREGUNTA
                // =================================

                const preguntaRef =
                    doc(
                        db,
                        "preguntas",
                        preguntaId
                    );


                const preguntaSnapshot =
                    await getDoc(
                        preguntaRef
                    );


                if (!preguntaSnapshot.exists()) {

                    mostrarError(
                        "La pregunta no existe en Firestore."
                    );

                    return;

                }


                const datos =
                    preguntaSnapshot.data();


                console.log(
                    "Pregunta:",
                    datos
                );


                // =================================
                // MOSTRAR DATOS
                // =================================

                document.getElementById(
                    "pregunta"
                ).textContent =
                    datos.pregunta || "";


                document.getElementById(
                    "area"
                ).textContent =
                    datos.categoria || "";


                document.getElementById(
                    "usuario"
                ).textContent =
                    datos.usuarioCorreo || "";


                const estado =
                    datos.estado || "PENDIENTE";


                const estadoElemento =
                    document.getElementById(
                        "estado"
                    );


                estadoElemento.textContent =
                    estado;


                estadoElemento.className =
                    "estado " +
                    (
                        estado === "RESPONDIDA"
                            ? "respondida"
                            : "pendiente"
                    );


                if (datos.fecha) {

                    document.getElementById(
                        "fecha"
                    ).textContent =
                        datos.fecha
                            .toDate()
                            .toLocaleString(
                                "es-PE"
                            );

                } else {

                    document.getElementById(
                        "fecha"
                    ).textContent =
                        "-";

                }

                // =========================================
                // ARCHIVO ADJUNTO
                // =========================================
                
                const contenedorArchivo =
                    document.getElementById(
                        "contenedorArchivo"
                    );
                
                const archivoElemento =
                    document.getElementById(
                        "archivo"
                    );
                
                
                if (datos.archivoUrl) {
                
                    contenedorArchivo.style.display =
                        "block";
                
                
                    const nombreArchivo =
                        datos.archivoNombre ||
                        "Archivo adjunto";
                
                
                    const tipoArchivo =
                        datos.archivoTipo || "";
                
                
                    // =====================================
                    // IMAGEN
                    // =====================================
                
                    if (
                        tipoArchivo === "image" ||
                        /\.(jpg|jpeg)$/i.test(
                            nombreArchivo
                        )
                    ) {
                
                        archivoElemento.innerHTML = `
                
                            <img
                                src="${datos.archivoUrl}"
                                alt="${nombreArchivo}"
                                class="archivo-imagen">
                
                            <br>
                
                            <a
                                href="${datos.archivoUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="btn-archivo">
                
                                📎 Abrir imagen
                
                            </a>
                
                        `;
                
                    }
                
                    // =====================================
                    // PDF
                    // =====================================
                
                    else {
                
                        archivoElemento.innerHTML = `
                
                            <a
                                href="${datos.archivoUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="btn-archivo">
                
                                📎 Ver PDF
                
                            </a>
                
                            <span style="margin-left:8px;">
                                ${nombreArchivo}
                            </span>
                
                        `;
                
                    }
                
                }


                // =================================
                // BUSCAR RESPUESTA
                // =================================

                await cargarRespuesta(
                    preguntaId
                );


                // =================================
                // MOSTRAR FORMULARIO
                // =================================

                if (
                    usuario.rol === "RESPONDEDOR" ||
                    usuario.rol === "ADMINISTRADOR"
                ) {

                    if (estado === "PENDIENTE") {

                        document.getElementById(
                            "formularioRespuesta"
                        ).style.display =
                            "block";

                    }

                }


                // =================================
                // MOSTRAR CONTENIDO
                // =================================

                cargando.style.display =
                    "none";

                contenido.style.display =
                    "block";


            } catch (e) {

                console.error(e);

                mostrarError(
                    "Error: " + e.message
                );

            }

        }
    );


    // =========================================
    // CARGAR RESPUESTA
    // =========================================

    async function cargarRespuesta(id) {

        const referencia =
            collection(
                db,
                "respuestas"
            );


        const consulta =
            query(
                referencia,
                where(
                    "preguntaId",
                    "==",
                    id
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        if (resultado.empty) {

            document.getElementById(
                "respuesta"
            ).textContent =
                "Aún no existe una respuesta.";

            return;

        }


        const datos =
            resultado.docs[0].data();


        let texto =
            datos.respuesta || "";


        if (datos.usuarioCorreo) {

            texto +=
                "\n\nRespondido por: "
                + datos.usuarioCorreo;

        }


        if (datos.fecha) {

            texto +=
                "\nFecha: "
                + datos.fecha
                    .toDate()
                    .toLocaleString(
                        "es-PE"
                    );

        }


        document.getElementById(
            "respuesta"
        ).textContent =
            texto;

    }


    // =========================================
    // BOTÓN RESPONDER
    // =========================================

    document
        .getElementById(
            "btnResponder"
        )
        .addEventListener(
            "click",
            async function() {


                const texto =
                    document
                        .getElementById(
                            "textoRespuesta"
                        )
                        .value
                        .trim();


                if (!texto) {

                    alert(
                        "Escriba una respuesta."
                    );

                    return;

                }


                const user =
                    auth.currentUser;


                if (!user) {

                    alert(
                        "Sesión no válida."
                    );

                    return;

                }


                try {


                    // GUARDAR RESPUESTA

                    await addDoc(
                        collection(
                            db,
                            "respuestas"
                        ),
                        {

                            preguntaId:
                                preguntaId,

                            usuarioId:
                                user.uid,

                            usuarioCorreo:
                                user.email,

                            respuesta:
                                texto,

                            fecha:
                                serverTimestamp()

                        }
                    );


                    // ACTUALIZAR ESTADO

                    await updateDoc(
                        doc(
                            db,
                            "preguntas",
                            preguntaId
                        ),
                        {

                            estado:
                                "RESPONDIDA"

                        }
                    );


                    alert(
                        "Respuesta registrada correctamente."
                    );


                    window.location.reload();


                } catch (e) {

                    console.error(e);

                    alert(
                        "Error al registrar respuesta: "
                        + e.message
                    );

                }

            }
        );

</script>

</body>

</html>
