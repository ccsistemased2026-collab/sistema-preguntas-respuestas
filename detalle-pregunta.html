<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Detalle de pregunta</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            color: #333;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .label {
            font-weight: bold;
            color: #555;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        .pregunta {
            font-size: 20px;
            line-height: 1.6;
        }

        .respuesta {
            background: #f1f7fb;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .estado {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 5px;
            font-weight: bold;
        }

        .pendiente {
            background: #fff3cd;
            color: #856404;
        }

        .respondida {
            background: #d1e7dd;
            color: #0f5132;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            resize: vertical;
        }

        .button {
            display: inline-block;
            background: #1f4e78;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover {
            background: #163a5c;
        }

        .button-danger {
            background: #b42318;
        }

        .mensaje {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .mensaje-error {
            background: #f8d7da;
            color: #842029;
        }

        .mensaje-exito {
            background: #d1e7dd;
            color: #0f5132;
        }

        #formularioRespuesta {
            display: none;
        }

        #cargando {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>


<body>

<header>

    <h2>
        Preguntas y Respuestas
    </h2>

</header>


<main class="container">

    <!-- ==========================
         MENSAJES
    =========================== -->

    <div
        id="mensajeError"
        class="mensaje mensaje-error">
    </div>


    <div
        id="mensajeExito"
        class="mensaje mensaje-exito">
    </div>


    <!-- ==========================
         CARGANDO
    =========================== -->

    <div
        id="cargando"
        class="card">

        Cargando información...

    </div>


    <!-- ==========================
         DETALLE PREGUNTA
    =========================== -->

    <div
        id="detallePregunta"
        style="display:none;">


        <div class="card">

            <div class="label">
                Pregunta
            </div>

            <div
                id="pregunta"
                class="pregunta">
            </div>


            <div class="label">
                Categoría
            </div>

            <div id="categoria">
            </div>


            <div class="label">
                Estado
            </div>

            <div>

                <span
                    id="estado"
                    class="estado">
                </span>

            </div>


            <div class="label">
                Usuario
            </div>

            <div id="usuario">
            </div>


            <div class="label">
                Fecha
            </div>

            <div id="fecha">
            </div>

        </div>


        <!-- ==========================
             RESPUESTA EXISTENTE
        =========================== -->

        <div class="card">

            <div class="label">
                Respuesta
            </div>

            <div
                id="respuesta"
                class="respuesta">

                Aún no existe una respuesta.

            </div>

        </div>


        <!-- ==========================
             FORMULARIO RESPUESTA
        =========================== -->

        <div
            id="formularioRespuesta"
            class="card">

            <div class="label">
                Registrar respuesta
            </div>

            <br>

            <textarea
                id="textoRespuesta"
                placeholder="Escriba la respuesta a la consulta...">
            </textarea>

            <br><br>

            <button
                id="btnResponder"
                class="button">

                REGISTRAR RESPUESTA

            </button>

        </div>


        <br>


        <a
            href="preguntas.html"
            class="button">

            ← Volver a preguntas

        </a>


    </div>

</main>


<script type="module">

    // ==========================================
    // FIREBASE APP
    // ==========================================

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    // ==========================================
    // FIREBASE AUTH
    // ==========================================

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // ==========================================
    // FIRESTORE
    // ==========================================

    import {
        getFirestore,
        doc,
        getDoc,
        collection,
        query,
        where,
        getDocs,
        addDoc,
        updateDoc,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ==========================================
    // CONFIGURACIÓN FIREBASE
    // ==========================================

    const firebaseConfig = {

          apiKey: "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",
          authDomain: "sistema-preguntas-respuestas.firebaseapp.com",
          projectId: "sistema-preguntas-respuestas",
          storageBucket: "sistema-preguntas-respuestas.firebasestorage.app",
          messagingSenderId: "606737336904",
          appId: "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    // ==========================================
    // INICIALIZAR
    // ==========================================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    // ==========================================
    // OBTENER ID DE LA URL
    // ==========================================

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const preguntaId =
        parametros.get("id");
        let preguntaEstado = "";


    // ==========================================
    // ELEMENTOS HTML
    // ==========================================

    const cargando =
        document.getElementById("cargando");


    const detallePregunta =
        document.getElementById(
            "detallePregunta"
        );


    const formularioRespuesta =
        document.getElementById(
            "formularioRespuesta"
        );


    const mensajeError =
        document.getElementById(
            "mensajeError"
        );


    const mensajeExito =
        document.getElementById(
            "mensajeExito"
        );


    // ==========================================
    // MOSTRAR ERROR
    // ==========================================

    function mostrarError(mensaje) {

        mensajeError.textContent =
            mensaje;

        mensajeError.style.display =
            "block";

    }


    // ==========================================
    // MOSTRAR ÉXITO
    // ==========================================

    function mostrarExito(mensaje) {

        mensajeExito.textContent =
            mensaje;

        mensajeExito.style.display =
            "block";

    }


    // ==========================================
    // VERIFICAR LOGIN
    // ==========================================

    onAuthStateChanged(
        auth,
        async (user) => {

            console.log(
                "Usuario autenticado:",
                user
            );


            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            if (!preguntaId) {

                mostrarError(
                    "No se encontró el ID de la pregunta."
                );

                cargando.style.display =
                    "none";

                return;

            }


            try {

                // ==================================
                // OBTENER PERFIL DEL USUARIO
                // ==================================

                const usuarioRef =
                    doc(
                        db,
                        "usuarios",
                        user.uid
                    );


                const usuarioSnapshot =
                    await getDoc(
                        usuarioRef
                    );


                if (!usuarioSnapshot.exists()) {

                    mostrarError(
                        "No existe un perfil para este usuario."
                    );

                    cargando.style.display =
                        "none";

                    return;

                }


                const usuario =
                    usuarioSnapshot.data();


                console.log(
                    "Perfil:",
                    usuario
                );


                // ==================================
                // CARGAR PREGUNTA
                // ==================================

                await cargarPregunta();


                // ==================================
                // MOSTRAR FORMULARIO SEGÚN ROL
                // ==================================

                console.log(
                    "Rol del usuario:",
                    usuario.rol
                );

                if (
                    (
                        usuario.rol === "RESPONDEDOR" ||
                        usuario.rol === "ADMINISTRADOR"
                    )
                    &&
                    preguntaEstado === "PENDIENTE"
                ) {
                
                    formularioRespuesta.style.display =
                        "block";
                
                } else {
                
                    formularioRespuesta.style.display =
                        "none";


                }else {

                    formularioRespuesta.style.display =
                        "none";

                    console.log(
                        "Usuario no tiene permisos para responder."
                    );

                }


            } catch (error) {

                console.error(error);

                mostrarError(
                    "Error al cargar la información: "
                    + error.message
                );

                cargando.style.display =
                    "none";

            }

        }
    );


    // ==========================================
    // CARGAR PREGUNTA
    // ==========================================

    async function cargarPregunta() {

        const preguntaRef =
            doc(
                db,
                "preguntas",
                preguntaId
            );


        const preguntaSnapshot =
            await getDoc(
                preguntaRef
            );


        if (!preguntaSnapshot.exists()) {

            throw new Error(
                "La pregunta no existe."
            );

        }


        const datos =
            preguntaSnapshot.data();


        document.getElementById(
            "pregunta"
        ).textContent =
            datos.pregunta || "";


        document.getElementById(
            "categoria"
        ).textContent =
            datos.categoria || "";


         const estado =
            datos.estado || "PENDIENTE";
            
            preguntaEstado =
                estado;


        const elementoEstado =
            document.getElementById(
                "estado"
            );


        elementoEstado.textContent =
            estado;


        elementoEstado.className =
            "estado " +
            (
                estado === "RESPONDIDA"
                    ? "respondida"
                    : "pendiente"
            );


        document.getElementById(
            "usuario"
        ).textContent =
            datos.usuarioCorreo || "";


        if (datos.fecha) {

            document.getElementById(
                "fecha"
            ).textContent =
                datos.fecha
                    .toDate()
                    .toLocaleString(
                        "es-PE"
                    );

        } else {

            document.getElementById(
                "fecha"
            ).textContent =
                "Pendiente de registro";

        }


        // ==================================
        // BUSCAR RESPUESTA
        // ==================================

        await cargarRespuesta();


        cargando.style.display =
            "none";


        detallePregunta.style.display =
            "block";

    }


    // ==========================================
    // CARGAR RESPUESTA
    // ==========================================

    async function cargarRespuesta() {

        const respuestasRef =
            collection(
                db,
                "respuestas"
            );


        const consulta =
            query(
                respuestasRef,
                where(
                    "preguntaId",
                    "==",
                    preguntaId
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        const elementoRespuesta =
            document.getElementById(
                "respuesta"
            );


        if (resultado.empty) {

            elementoRespuesta.textContent =
                "Aún no existe una respuesta.";

            return;

        }


        const documento =
            resultado.docs[0];


        const datos =
            documento.data();


        let texto =
            datos.respuesta || "";


        if (datos.usuarioCorreo) {

            texto +=
                "\n\nRespondido por: "
                + datos.usuarioCorreo;

        }


        if (datos.fecha) {

            texto +=
                "\nFecha: "
                + datos.fecha
                    .toDate()
                    .toLocaleString(
                        "es-PE"
                    );

        }


        elementoRespuesta.textContent =
            texto;

    }


    // ==========================================
    // REGISTRAR RESPUESTA
    // ==========================================

    document
        .getElementById("btnResponder")
        .addEventListener(
            "click",
            async function() {


                const texto =
                    document
                        .getElementById(
                            "textoRespuesta"
                        )
                        .value
                        .trim();


                if (!texto) {

                    mostrarError(
                        "Debe escribir una respuesta."
                    );

                    return;

                }


                const user =
                    auth.currentUser;


                if (!user) {

                    mostrarError(
                        "La sesión ha expirado."
                    );

                    return;

                }


                try {


                    // ==================================
                    // GUARDAR RESPUESTA
                    // ==================================

                    await addDoc(
                        collection(
                            db,
                            "respuestas"
                        ),
                        {

                            preguntaId:
                                preguntaId,

                            usuarioId:
                                user.uid,

                            usuarioCorreo:
                                user.email,

                            respuesta:
                                texto,

                            fecha:
                                serverTimestamp()

                        }
                    );


                    // ==================================
                    // ACTUALIZAR ESTADO
                    // ==================================

                    const preguntaRef =
                        doc(
                            db,
                            "preguntas",
                            preguntaId
                        );


                    await updateDoc(
                        preguntaRef,
                        {

                            estado:
                                "RESPONDIDA"

                        }
                    );


                    mostrarExito(
                        "Respuesta registrada correctamente."
                    );


                    document
                        .getElementById(
                            "textoRespuesta"
                        )
                        .value = "";


                    await cargarPregunta();


                } catch (error) {

                    console.error(error);

                    mostrarError(
                        "No se pudo registrar la respuesta: "
                        + error.message
                    );

                }

            }
        );

</script>

</body>

</html>
