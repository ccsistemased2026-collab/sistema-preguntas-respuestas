<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Detalle de pregunta</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1f4e78;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        .label {
            font-weight: bold;
            color: #555;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .pregunta {
            font-size: 20px;
            line-height: 1.6;
        }

        .respuesta {
            background: #f1f7fb;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            background: #1f4e78;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<header>

    <h2>
        Detalle de pregunta
    </h2>

</header>


<main class="container">

    <div class="card">

        <div class="label">
            Pregunta
        </div>

        <div
            id="pregunta"
            class="pregunta">

            Cargando...

        </div>


        <div class="label">
            Categoría
        </div>

        <div id="categoria">
            -
        </div>


        <div class="label">
            Estado
        </div>

        <div id="estado">
            -
        </div>


        <div class="label">
            Usuario
        </div>

        <div id="usuario">
            -
        </div>


        <div class="label">
            Fecha
        </div>

        <div id="fecha">
            -
        </div>

    </div>


    <div class="card">

        <div class="label">
            Respuesta
        </div>

        <div
            id="respuesta"
            class="respuesta">

            Aún no existe una respuesta.

        </div>

    </div>


    <a
        href="preguntas.html"
        class="button">

        ← Volver a preguntas

    </a>

</main>
<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ==========================
    // CONFIGURACIÓN FIREBASE
    // ==========================

    const firebaseConfig = {

        apiKey: "AIzaSyCOFJqQZdn7hFaIbjl3s9mvcnXVNNi5e0w",
        authDomain: "sistema-preguntas-respuestas.firebaseapp.com",
        projectId: "sistema-preguntas-respuestas",
        storageBucket: "sistema-preguntas-respuestas.firebasestorage.app",
        messagingSenderId: "606737336904",
        appId: "1:606737336904:web:44fb42be60fbdaaf08667d"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    // ==========================
    // OBTENER ID DE LA PREGUNTA
    // ==========================

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    const preguntaId =
        parametros.get("id");


    // ==========================
    // VERIFICAR USUARIO
    // ==========================

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }


        if (!preguntaId) {

            alert(
                "No se indicó la pregunta."
            );

            window.location.href =
                "preguntas.html";

            return;
        }


        await cargarPregunta();

    });


    // ==========================
    // CARGAR PREGUNTA
    // ==========================

    async function cargarPregunta() {

        try {

            const referencia =
                doc(
                    db,
                    "preguntas",
                    preguntaId
                );


            const resultado =
                await getDoc(referencia);


            if (!resultado.exists()) {

                alert(
                    "La pregunta no existe."
                );

                window.location.href =
                    "preguntas.html";

                return;
            }


            const datos =
                resultado.data();


            document.getElementById(
                "pregunta"
            ).textContent =
                datos.pregunta || "";


            document.getElementById(
                "categoria"
            ).textContent =
                datos.categoria || "";


            document.getElementById(
                "estado"
            ).textContent =
                datos.estado || "PENDIENTE";


            document.getElementById(
                "usuario"
            ).textContent =
                datos.usuarioCorreo || "";


            if (datos.fecha) {

                document.getElementById(
                    "fecha"
                ).textContent =
                    datos.fecha
                        .toDate()
                        .toLocaleString(
                            "es-PE"
                        );

            }

        } catch (error) {

            console.error(error);

            alert(
                "No se pudo cargar la pregunta."
            );

        }

    }

</script>
</body>

</html>
